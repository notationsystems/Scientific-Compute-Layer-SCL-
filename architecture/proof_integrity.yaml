# WHEN A CHECK PROVES SOMETHING ABOUT ITSELF INSTEAD OF ABOUT ITS TARGET.
#
# A named failure class, held HERE rather than in either repository's own
# contract because every instance was found in one layer and applies to
# both. Byte-identical in the compute and acquisition repositories and
# checked by architecture/exchange/verify_pair_landed.py, for the same
# reason the shared serializer is: a rule one side can edit alone is a
# rule the two sides can come to disagree about.
#
# THE SHAPE. A check has a target and a subject. The target is what it is
# meant to establish; the subject is what it actually reads. When those
# come apart, the check keeps reporting -- confidently, in the reassuring
# direction -- about the subject. Every instance below passed while the
# property it named was false.
#
# WHY THIS ONE OUTRANKS ORDINARY DEFECTS. A wrong implementation is one
# wrong thing. A hollow proof is every conclusion that rested on it. The
# shadowed-test instance is the sharpest: it did not sit alongside the
# other repairs in this phase, it undermined the evidence for them, in the
# one file where the encoding work was proved.
extends: core@1.0.0

rule: "A GREEN SUITE IS NOT EVIDENCE THAT THE TESTS IN IT RAN. More generally: establish that a check CAN fail on the thing it names, or it has established nothing. A check that has never been shown to fail has not been shown to be capable of failing."

required_step: "for every new check, plant the defect it claims to catch and watch it fail, before trusting a pass. Not a review step -- a construction step. Every instance below was caught this way or would have been."

# ------------------------------------------------------- the instances --

instances:

  - name: grep_for_fatal
    target: "did the push succeed?"
    subject: "does the word `fatal` appear in the command output?"
    what_happened: "matched a stale `fatal` from earlier output and reported failure over a success, confidently. The pair went half-landed."
    repair: "ask the REMOTE for its state (git ls-remote), not the output for a string."
    severity: reported_the_opposite_of_the_truth

  - name: absence_of_violation_mistaken_for_emptiness
    target: "is the forbidden domain empty?"
    subject: "did the scan find a violation?"
    what_happened: "a scan over an empty or wrongly-built domain finds nothing and passes. Measured once with a confounded probe: a plain dict is itself unhashable, so every consumer check failed for the wrong reason."
    repair: "assert the domain is non-empty BEFORE asserting it is clean. Emptiness is a fact about today; hold it where it reports when it stops being true."
    severity: vacuous_pass

  - name: mutation_applied_mistaken_for_mutation_effective
    target: "does the suite catch this broken behaviour?"
    subject: "was a textual diff applied to the file?"
    what_happened: "a clause-3 mutation that added only a comment compiled and reported SURVIVED, as though a test had failed to catch a real change. There was no change to catch."
    repair: "compare with comments stripped (C++) or through an AST (Python); a diff that cannot reach execution is MALFORMED, counted neither as caught nor as surviving."
    severity: reported_a_test_gap_that_did_not_exist

  - name: coverage_specified_by_enumeration
    target: "is every artifact of this kind checked?"
    subject: "are the artifacts in this written list checked?"
    what_happened: "the two-parser typed-agreement check globbed architecture/exchange and architecture/proposals and NOT architecture/decisions -- so the one artifact type binding a joint decision to its input hashes was never checked, and an escape defect reached a hash-bearing artifact with every suite green."
    repair: "assert the PROPERTY, not the enumeration: every directory carrying a .sha256 sidecar has its artifacts in the checked set. Adding the missing directory fixes one instance; asserting the rule fixes the class."
    severity: reported_green_over_the_hole
    arrived_at_independently_by: "the acquisition layer, which proposes it as core vocabulary in architecture/exchange/daq_capabilities.yaml"

  - name: an_enforcement_claim_that_names_a_file_saying_nothing_about_it
    target: "is this invariant enforced?"
    subject: "does the ledger name a test file that exists?"
    what_happened: "generation_depth_bounded named an enforcement file containing nothing about it and stayed green for 35 phases. Measuring it found 17 other invariants in the same state. Caught again in THIS phase: the new invariant added for the shadowed-test rule named its guard, and the guard did not mention the invariant."
    repair: "tests/test_recursive_lineage_depth.py -- the named file must MENTION the invariant id, with the pre-existing set locked so it cannot grow. A deliberately weak bar: it is the bar the ledger's own claim of enforcement should already clear, and 18 entries did not."
    severity: enforcement_claimed_and_absent
    note: "the only instance in this list caught by an existing guard rather than by the phase that introduced it. That is the shape the rest of this file is trying to produce."

  - name: shadowed_test
    target: "do these tests pass?"
    subject: "does the module's namespace, after import, pass?"
    what_happened: "three functions were redefined later in the same file. Python keeps the last binding, so the earlier three were dead code, and pytest -- which collects a namespace, not a source file -- reported 82 collected and green while three of them did not exist. A shadowed test is not a failing test, it is an ABSENT one. One of the three called a name the repository does not define, so it could not have run even unshadowed: a two-parser agreement check had been written, reviewed, committed, and never once executed."
    repair: "tests/test_no_test_name_is_shadowed.py -- refuse any module binding a test name twice, read from SOURCE via AST, because the imported module is exactly where the evidence has already been destroyed."
    severity: undermined_the_evidence_for_every_other_repair_in_the_phase

  - name: a_property_stated_in_an_artifact_is_not_a_property_enforced_by_one
    target: "does this reissue name the fixture it replaced?"
    subject: "nothing -- no check read the field"
    what_happened: "one repository's record named the NEW fixture as its own predecessor (a self-link); the other never moved the field at all (a skipped link). The two records disagreed while both suites were green."
    repair: "two tests -- one rejecting a self-link, one checking the named predecessor against committed git history rather than against the record's own say-so. A record is not an oracle for its own provenance."
    severity: silent_divergence_between_repositories

  - name: verify_certified_the_corruption
    target: "was this stored file tampered with or corrupted?"
    subject: "does the id recomputed from these fields match the id stored beside them?"
    what_happened: "a file containing a bare NaN was read back, its id recomputed, and _verify PASSED -- correctly by content_hash's own rules, because hashing is deterministic over whatever bytes it is handed. The check did not fail to catch the corruption; it certified it. The value so certified was not equal to itself, and the bytes are not JSON, so the id was reproducible by exactly one implementation. The module docstring claimed on-disk corruption 'is caught on read rather than trusted'."
    repair: "strict_json_loads at every reader whose writer already refuses. And the general form: recomputation succeeding is not the property wanted -- INDEPENDENT recomputability is."
    severity: an_integrity_check_that_blessed_the_thing_it_guarded_against

# ------------------------------------------ what convergence is worth --

  - name: a_self_describing_artifact_lying_about_its_own_encoding
    target: "is this artifact what it says it is?"
    subject: "does the artifact match its digest?"
    what_happened: "daq_capabilities.yaml carries a canonicalization block DESCRIBING the rules it was emitted under. That block went stale through TWO coordinated reissues: it stated the pre-always-quote string rule -- the one the FIRST reissue replaced -- and named a shared-fixture digest from before both. Every integrity check in both repositories passed the whole time."
    why_no_digest_check_could_catch_it: "THE CONTENT AND THE ENCODING DISAGREED, AND THE DIGEST IS OVER THE CONTENT. Both reissues recomputed the hash correctly and both sidecars matched. The stale claim WAS content, so hashing it faithfully is exactly what a correct digest does. There is no arrangement of digest checks that sees this."
    why_it_is_its_own_shape: "every mechanism this pair has built verifies an artifact against its DIGEST, and none verified one against its own CLAIMS. That is a gap in the kind of thing being checked, not a gap in coverage of a known kind."
    repair: "assert equality between each self-descriptive claim and the fact it describes. The claims were already checkable -- a named file exists or does not, a quoted digest matches the sidecar or does not, a stated string rule matches emitter behaviour or does not. Nothing new had to be measured; something had to be COMPARED."
    the_check_is_driven_by_the_claims: "each claim is bound to a verifier BY NAME and a claim with no verifier fails, so the next field added to the block cannot be silently unchecked. Hand-listing the assertions would have been the enumerated form, in the file that names it."
    verified_by_planting_the_defect: "both real staleness cases are replayed against the verifiers that now cover them, plus a third the block would have hidden the same way. A lying artifact is also constructed and shown to be perfectly self-consistent under every digest check that exists."
    enforcement: tests/test_self_description_matches_the_artifact.py
    severity: an_artifact_that_certified_correctly_while_describing_a_rule_it_was_not_emitted_under

  - name: a_measured_fact_recorded_in_prose_has_nothing_defending_it
    target: "is the recorded reason for this defect the measured one?"
    subject: "does the prose read plausibly?"
    what_happened: "the acquisition half MEASURED the collection defect correctly -- the compact single-element form is silently mistyped, and architecture/canonicalization_defect.yaml has said so since 88248ac, unchanged. The compute half probed the multi-element form, which raises, and recorded a loud refusal. The merge then adopted the compute half's serializer WHOLESALE on a behavioural-equivalence check, and the adopted file's prose carried its reason -- silently replacing a correct measurement with an incorrect one, in the same repository that still held the correct one."
    what_no_test_covered: "the claim. Behavioural equivalence was verified and held: byte-identical output across every document, identical refusals. Nothing compared a code comment to an architecture record, and nothing could, because a reason recorded in prose is not bound to anything."
    why_it_is_worse_than_two_authors_agreeing: "a second author agreeing adds no coverage. A merge REPLACING a correct measurement is worse than that -- it removes coverage that existed. The repository knew the right answer and stopped saying it."
    repair: "behavioural equivalence licenses taking the other side's CODE. It does not license taking their ACCOUNT OF WHY. Where a reason is load-bearing, bind it: the emitter's refusal message and the architecture record now state the same measured shapes, and the tests pin both."
    severity: coverage_that_existed_was_silently_removed

the_rate_is_itself_the_finding:
  observation: "instances of this class are being found BY the class, and faster than they are being filed. Generalizing the reissue chain check from one named artifact to a derived set found two further unchained bindings IN THE SAME COMMIT that filed the principle. Closing the cell-leaf denylist found six admitted types nobody had listed. The self-description check, written to close one instance, has a construction whose whole point is that it cannot become another."
  what_the_rate_suggests: "the enumerated form is not an occasional slip. It is the DEFAULT SHAPE of a check written under time pressure, because naming what to look at is always easier than deriving it, and it always works on the cases the author has in mind. The correct prior when reading any check in this repository is that its coverage is a list until shown otherwise."
  the_practical_consequence: "asserting the property rather than the enumeration is not a repair to apply when an instance is found. It is the construction rule for every new check, and this file's required_step -- plant the defect and watch it fail -- is what reveals which form was actually written."
  a_caution_against_the_obvious_reading: "a class that finds its own instances quickly may be a real class, or may be a lens that makes everything look like itself. The counter-evidence would be a check whose coverage is a list and which is nevertheless correct and stays correct -- a closed vocabulary, for instance, where the list IS the property. Those exist here (uncertainty_kind, the absence reasons) and are not instances. The distinction is whether the world can grow an item the list did not anticipate."

convergence_is_not_evidence:
  claim_being_corrected: "an earlier note recorded two subsystems independently deriving the same rule as EVIDENCE ABOUT THE CLASS rather than a coincidence about the phase. That note overstates, and this entry is filed next to it rather than replacing it."
  the_counter_instance: "two sessions independently closed the canonical-YAML collection class, independently reached the same refusal, by the same argument. The convergence was real and it still added no second measurement."
  the_counter_instance_corrected: "an earlier statement of this entry said BOTH halves recorded the same wrong reason. Re-checked against what each half actually measured, and it is not what happened. The compute half probed the multi-element compact form, which DOES raise, and recorded a loud refusal. The acquisition half probed single-element inner sequences, measured the SILENT mistyping correctly, and recorded it -- architecture/canonicalization_defect.yaml has carried that measurement since 88248ac, unchanged, and still does."
  what_actually_went_wrong: "the merge. The acquisition half adopted the compute half's serializer WHOLESALE on a behavioural-equivalence check, and the adopted file's prose carried the compute half's reason into a repository that still held the correct one. A correct measurement was silently replaced by an incorrect one."
  why_the_corrected_version_is_the_stronger_lesson: "not two arrivals agreeing on a wrong reason, which would be a coincidence. A merge REMOVING coverage that existed, with no test anywhere covering the claim -- because a measured fact recorded in prose is bound to nothing. Filed as its own instance above."
  what_it_actually_shows: "two authors reaching the same conclusion shows they share a method, a vocabulary, or a blind spot -- often all three. It is not a second measurement. Here the two halves probed DIFFERENT shapes and reached the same conclusion for different reasons, one of them wrong -- which is the same lesson from the other direction: the agreement was not evidence, and neither was the disagreement visible, because nothing compared the two accounts."
  demoted_to: "a PROMPT TO RE-MEASURE, not a form of evidence. Convergence raises the value of re-running the underlying measurement; it never substitutes for it."
  what_did_catch_it: "running the two readers against each other, on every shape, including the ones neither half had probed."
  the_practice_that_survives: "when two independent efforts agree, UNION their fixtures rather than choosing one -- neither set subsumed the other, and a shape nobody pins is a shape nobody agreed. That is a coverage argument, and it stands. The evidential claim does not."

# ------------------------------------------- the sharpest sub-family --

coverage_specified_by_enumeration:
  proposed_by: "the acquisition layer, independently and in the same phase, as a core-vocabulary candidate on the same footing as absent-is-not-zero and one-meaning-one-encoding. Its formal statement lives in architecture/exchange/daq_capabilities.yaml under core_vocabulary_candidates, where it is hash-bound as a proposal to the other layer. It is NOT restated here -- one statement, one home; this entry records the relationship."
  what_it_is: "the sub-family of this class in which the proxy is A LIST SOMEONE WROTE. A glob over enumerated directories, a grep for a specific string, a search over a named file set."
  how_to_tell_you_are_in_it: "the check NAMES what it looks at instead of deriving it."
  why_it_is_the_sharpest: "a check specified by enumeration is correct exactly until the world grows an item nobody added to the list, and it fails SILENTLY at that moment -- it reports success, because the thing it enumerates is still fine. No coverage at all leaves a visible hole; coverage-by-enumeration reports green over the hole, and the green is then cited as evidence."
  its_repair_rule_is_adopted_for_the_whole_class: "ASSERT THE PROPERTY, NOT THE ENUMERATION. Sharper than the general diagnostic below and strictly stronger where it applies: adding the missing item fixes one instance, asserting the property fixes the class. The shadow guard follows it -- it refuses any module binding a test name twice, over every module found, rather than checking the files known to have had the problem."
  and_the_convergence_caveat_applies_to_this_entry_too: "two layers reaching this class in one phase is why it is filed now. Per convergence_is_not_evidence above, that is a prompt rather than a proof -- what makes it a class is the eight instances below, each measured, not the fact that two authors named it."

# ------------------------------------------------------- the pattern --

why_these_are_one_class:
  common_form: "the check reads a PROXY for its target -- output text for state, a diff for a behaviour change, a namespace for a source file, a field's presence for its correctness, a self-consistent recomputation for independent reproducibility."
  why_the_proxy_is_chosen: "in every instance the proxy was easier to read and correlated with the target in the cases the author had in mind. It decorrelates exactly where it matters: on the failure the check exists to catch."
  the_diagnostic_question: "what would have to be true for this check to pass while the property it names is false? If that state is reachable, the check reads a proxy."
  relation_to_the_encoding_rule: "adjacent, not identical. One-meaning-one-encoding is about ambiguous BYTES; this is about hollow PROOFS. They meet where a proof is itself an artifact -- the reissue chain and the integrity check are both."
