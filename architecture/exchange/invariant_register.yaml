  "the_property_set_split": "ten of them were written when the generality probe declared FOUR properties; one was written after it declared five. Same words, two assertions. Which set each quantified over is verified against git in tests/test_invariant_register.py, not asserted here."
  "what_stops_it_recurring": "this block is derived by scanning the documents, so a `Bent: zero` written tomorrow and not accounted for here moves the register's digest and fails its test until someone re-derives -- which is the point at which they have to say what set they mean."
  "what_they_are": "every `Bent: zero` written in this repository's phase reports is a claim that no CORE invariant changed -- a claim about STE, the party with no enumeration."
  "what_was_wrong_was_not_the_verdicts": "it was that nothing recorded WHICH SET each claim quantified over. A verdict that happens to survive a change in what it quantifies over is not a verdict that accounted for the change. All eleven rest on the same byte-identity entailment named above, which is what actually carries them."
  "why_both_are_recorded": "the scan matches the CLAIM FORM -- the bolded assertion every phase report making one uses. Anything else naming the phrase is a mention: a heading, a backticked reference, prose about the class. Both are listed so the narrowing is visible, and so a claim written in some new form appears here as a mention with no claim beside it."
