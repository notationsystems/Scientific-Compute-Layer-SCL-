    "why_not": "cited only inside the range `I1-I8`, never individually. The sentence carrying that range constrains the RANGE as a whole -- arrows point strictly downward/rightward from canonical state, and the only path back is the feedback loop through schema/validation -- so I1 is somewhere in that idea and nothing narrows it further."
