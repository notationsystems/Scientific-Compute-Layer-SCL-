"authorship_provenance":
  "prior_convergence_noted_and_discounted": "a concurrent session recommended the same workload from the same two artifacts. That is corroboration of a reading, not independent confirmation: it used the same measured inputs and the same stated rule."
  "statement": "BOTH SIDES OF THIS RECORD WERE AUTHORED IN ONE SESSION, BY ONE AGENT, HOLDING PUSH CREDENTIALS FOR BOTH REPOSITORIES. That is recorded plainly because a reader would otherwise infer an independence that did not exist."
  "what_actually_mitigates_it": "not the authorship. The artifact hashes above bind this decision to measurements neither side can retroactively alter: each artifact is generated by a committed script from committed source, each regenerates byte-identically, and each is verified against its own repository's sidecar. A reader who distrusts this record's authorship can re-derive both inputs from scratch and check the digests. That property is independent of who held the pens."
  "what_is_NOT_claimed":
    - "that two independent parties reached this conclusion"
    - "that either repository's position was formed without knowledge of the other's -- both artifacts were read by the same agent before this was written"
    - "that the corroborating convergence cited below is independent evidence; it is noted and discounted"
  "why_it_is_stated": "the earlier version of this decision was demoted to a DAQ proposal on the correct grounds that a session with write access to one repository and read-only access to the other was one party writing both sides. Holding both pens is weaker than that failure, and it is not nothing: the value of a joint record is that it cannot be reconstructed from a single session's memory, and one agent with both credentials is exactly one session's memory."
"binding_rule": "the hashes above bind this decision to the exact measured artifacts that produced it, so it cannot be reconstructed from any agent's account of either repository. If either artifact changes, this record must be REISSUED rather than edited."
