"capabilities_artifact": "architecture/exchange/daq_capabilities.yaml"
"capabilities_artifact_hash": "sha256:d985e1a30a3d3978b357ff87edf3842dcba237bcf0536f80887ee2b663492ea5"
"capabilities_artifact_owner": "daf -- authored in its own repository, this is the origin copy"
"decision":
  "daq_extension": "none"
  "naming": "the operation is fourier_transform_1d. FFT is an implementation strategy, not the mathematical operation, and must not be the operation name."
  "workload": "fourier_transform_1d"
"decision_id": "2026-08-26-joint-workload-decision"
"extends": "core@1.0.0"
"obligations_created":
  - "SCL: fourier_transform_1d is already implemented and validated; no new build obligation arises from this record. What it does create is the comparability obligation -- two results with equal computation_identity and different sample spacing are comparable as bin-indexed vectors and NOT as spectra, and no comparison layer owns that check."
  - "DAQ: none. daq_extension is none and no DAQ change is required."
  - "JOINT: the sample-spacing conversion is unowned. DAQ supplies per-sample timestamps; the transform accepts one optional scalar spacing; nothing establishes that a series is uniform enough for a single spacing to be honest. The real series is uniform, and nothing checks it."
"rationale":
  - "least_squares, pca and viterbi are eliminated by the rule rather than by preference: all require a modality the capability artifact marks MISSING -- an aligned observation table with stable variable identity, or a categorical emission sequence. Neither exists."
  - "kalman_filter_linear is eliminated on two independent measured grounds. Its structured-uncertainty requirement is UNSATISFIED: a covariance is not merely absent but silently admitted by the gate and fails later at the comparison consumer. Its recursive-depth requirement is UNSATISFIED: generation_depth_bounded has no implementation and, until corrected this phase, carried evidence that proved acyclicity rather than boundedness."
  - "pid_controller is satisfied for pure computation, but its distinctive value is actuation and no actuation-authority boundary exists in either repository. Building it would create an implicit control plane."
  - "that leaves fourier_transform_1d and convolution_1d with identical observation requirements, both satisfied by the real NOAA series -- 240 readings, uniform at 360.0 s. fourier_transform_1d is selected on generality falsification (a transform is orthogonal to the one kernel the substrate has been exercised by, where convolution shares its reduction shape), on validation quality (analytic oracles that depend on no second implementation, where convolution's natural oracle is another convolution), and on contract generality (it forces direction, normalization, precision and sample_spacing to be explicit rather than backend defaults)."
  - "daq_extension is none because the workload needs nothing DAQ lacks. CO-OPS states no sample spacing, and the correct consequence is a bin-index axis rather than a fabricated frequency axis. Extending DAQ to carry a spacing the source never provided would be fabrication."
"requirements_artifact": "architecture/exchange/scl_requirements.yaml"
"requirements_artifact_hash": "sha256:0ce4753c148de759f13c796c573def9c7f95c9d343f6b7b3d598a7d1e3f9d5ec"
"requirements_artifact_owner": "scl -- authored in its own repository at 6b63c11; the copy here is a byte-identical read-only mirror"
"selection_rule": "select the highest-leverage workload whose observation requirements are ALREADY satisfied by DAQ, and extend DAQ only for a named consuming workload"
"status": "decided"
"supersedes": "architecture/proposals/2026-08-25-daq-workload-proposal.yaml, which is DAQ's half and remains as the record of that half"
"verification_instructions": "regenerate each artifact from its own repository's committed generator and compare against the digest recorded above and in that repository's sidecar. Both generators are deterministic and both regenerate byte-identically; the canonicalization fixture digest above is the agreement check that the two repositories encode identically."
"what_this_decision_defers_and_why":
  "its_named_consuming_workload_would_be_kalman": "which is what the rule requires of any extension. So the extension is admissible under the rule the moment it is paired with Kalman -- it is deferred on SEQUENCING and on its second blocking requirement, not forbidden."
  "the_non_scalar_extension": "structured uncertainty and multivariate value are ONE extension, not two -- measured, not argued: relaxing the multivariate type check alone converts the uncertainty failure from a loud gate refusal into a silent late TypeError. Within it, the structured-uncertainty half must LEAD, because it is the silent one."
  "this_record_does_not_foreclose_it": true
  "what_would_have_to_be_true_first":
    - "the non-scalar quantity contract must answer its open semantic questions, not merely add a hashable sequence: the unit of a vector, dimensional agreement between a value and its covariance, whether uncertainty_kind's four values mean the same thing for a matrix, component identity, and per-component absence"
    - "the verbatim pass-through route must be tightened in the same step, or the next unhashable shape arrives by the same path"
    - "the depth rule must be authored BEFORE the first recursive result exists -- authoring it afterwards would shape it around the thing it constrains, which is the one condition that would make the correction a bend"
