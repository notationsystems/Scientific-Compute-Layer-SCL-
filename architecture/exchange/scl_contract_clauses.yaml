"clause_10_is_the_named_exception": "clause 10 is PROBE THE RULE, NOT THE TESTS. It is a procedure the other clauses are checked by, not a property of a registry entry, so a dedicated test asserting it would be a test asserting that testing happened. It is reported here as having no dedicated test rather than being quietly excluded from the count, because a clause nobody checks and a clause that cannot be checked look identical in a list that hides one of them."
