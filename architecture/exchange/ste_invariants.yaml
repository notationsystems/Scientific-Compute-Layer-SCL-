  "I3":
    "cited_with":
      - "I4"
      - "I8"
    "reconstruction": "validation is what produces canonical truth: a candidate delta becomes canonical state only by passing schema/validation, and representation metadata is never admitted into CanonicalState, Version or ProjectedState."
    "recoverable": "partially"
    "what_would_refute_it": "a citation of I3 on a statement about something other than admission-through-validation."
  "I4":
    "cited_with":
      - "I3"
    "reconstruction": "relationships are EXPLICIT ONLY. `CanonicalState.edges` carries `EdgeRecord`s that were stated, never inferred; inference is marked downstream in Morpho as `is_canonical`/`inference_status` rather than folded back into canonical state."
    "recoverable": "partially"
    "what_would_refute_it": "a citation of I4 on a non-edge, non-relationship statement."
  "I5":
    "citations": 6
    "reconstruction": "IDENTITY IS THE FIELD NAME, NEVER THE VALUE. `Field.id == field_name` and equals its own dict key; `Entity.id` is unchanged by value changes; every downstream identity (geometry_id, visual_id, node_id, cell_id) is a function of that same string. In v1 the id does not change."
    "recoverable": true
    "what_would_refute_it": "nothing in the index: this is the one number cited enough times, in enough distinct statements, to be pinned rather than inferred."
  "I6":
    "cited_with":
      - "I7"
    "reconstruction": "determinism of projection, RELATIVE TO THE COMPILER: the same canonical version plus the same compiler_version yields the same projection. compiler_version is always present, and the spec says so explicitly -- 'this is what makes I6 checkable'."
    "recoverable": true
    "what_would_refute_it": "a citation of I6 on a statement not about reproducible projection."
  "I7":
    "cited_with":
      - "I6"
    "reconstruction": "byte-identity of the projection, the stronger form beside I6: same version in, byte-identical ProjectedState out, always. Cited only jointly with I6, so which half of that sentence is I6 and which is I7 is inference."
    "recoverable": "partially"
    "what_would_refute_it": "any individual citation of I7. There is none, which is why the split between I6 and I7 is the weakest reconstruction here that is offered at all."
  "I8":
    "cited_with":
      - "I3"
    "reconstruction": "representation stays in the renderer. THREE.* objects live in the renderer runtime only, and backend/layout configuration is not part of CanonicalState at all."
    "recoverable": "partially"
    "what_would_refute_it": "a citation of I8 on a statement about canonical state itself."
