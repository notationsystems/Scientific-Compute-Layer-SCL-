# WHEN A CHECK PROVES SOMETHING ABOUT ITSELF INSTEAD OF ABOUT ITS TARGET.
#
# A named failure class, held HERE rather than in either repository's own
# contract because every instance was found in one layer and applies to
# both. Byte-identical in the compute and acquisition repositories and
# checked by architecture/exchange/verify_pair_landed.py, for the same
# reason the shared serializer is: a rule one side can edit alone is a
# rule the two sides can come to disagree about.
#
# THE SHAPE. A check has a target and a subject. The target is what it is
# meant to establish; the subject is what it actually reads. When those
# come apart, the check keeps reporting -- confidently, in the reassuring
# direction -- about the subject. Every instance below passed while the
# property it named was false.
#
# WHY THIS ONE OUTRANKS ORDINARY DEFECTS. A wrong implementation is one
# wrong thing. A hollow proof is every conclusion that rested on it. The
# shadowed-test instance is the sharpest: it did not sit alongside the
# other repairs in this phase, it undermined the evidence for them, in the
# one file where the encoding work was proved.
extends: core@1.0.0

rule: "A GREEN SUITE IS NOT EVIDENCE THAT THE TESTS IN IT RAN. More generally: establish that a check CAN fail on the thing it names, or it has established nothing. A check that has never been shown to fail has not been shown to be capable of failing."

required_step: "for every new check, plant the defect it claims to catch and watch it fail, before trusting a pass. Not a review step -- a construction step. Every instance below was caught this way or would have been."

# ------------------------------------------------------- the instances --

instances:

  - name: grep_for_fatal
    target: "did the push succeed?"
    subject: "does the word `fatal` appear in the command output?"
    what_happened: "matched a stale `fatal` from earlier output and reported failure over a success, confidently. The pair went half-landed."
    repair: "ask the REMOTE for its state (git ls-remote), not the output for a string."
    severity: reported_the_opposite_of_the_truth

  - name: absence_of_violation_mistaken_for_emptiness
    target: "is the forbidden domain empty?"
    subject: "did the scan find a violation?"
    what_happened: "a scan over an empty or wrongly-built domain finds nothing and passes. Measured once with a confounded probe: a plain dict is itself unhashable, so every consumer check failed for the wrong reason."
    repair: "assert the domain is non-empty BEFORE asserting it is clean. Emptiness is a fact about today; hold it where it reports when it stops being true."
    severity: vacuous_pass

  - name: mutation_applied_mistaken_for_mutation_effective
    target: "does the suite catch this broken behaviour?"
    subject: "was a textual diff applied to the file?"
    what_happened: "a clause-3 mutation that added only a comment compiled and reported SURVIVED, as though a test had failed to catch a real change. There was no change to catch."
    repair: "compare with comments stripped (C++) or through an AST (Python); a diff that cannot reach execution is MALFORMED, counted neither as caught nor as surviving."
    severity: reported_a_test_gap_that_did_not_exist

  - name: coverage_specified_by_enumeration
    target: "is every artifact of this kind checked?"
    subject: "are the artifacts in this written list checked?"
    what_happened: "the two-parser typed-agreement check globbed architecture/exchange and architecture/proposals and NOT architecture/decisions -- so the one artifact type binding a joint decision to its input hashes was never checked, and an escape defect reached a hash-bearing artifact with every suite green."
    repair: "assert the PROPERTY, not the enumeration: every directory carrying a .sha256 sidecar has its artifacts in the checked set. Adding the missing directory fixes one instance; asserting the rule fixes the class."
    severity: reported_green_over_the_hole
    arrived_at_independently_by: "the acquisition layer, which proposes it as core vocabulary in architecture/exchange/daq_capabilities.yaml"

  - name: the_repair_that_reproduced_the_defect_it_repaired
    target: "is a table cell a quantity?"
    subject: "is the cell one of the three types we wrote down as bad?"
    what_happened: "a bool cell was found admissible in a design matrix and refused. The refusal was implemented by adding BOOLEAN_IS_NOT_A_QUANTITY to a leaf classifier that already named two forbidden types -- so the fix was a third entry on a denylist. Probed afterwards against fifteen leaf types inside a 2x2 matrix, six were still admitted: None, bytes, a complex number, a Decimal, a Fraction and a set. Each would sit in a covariance entry meaning nothing."
    repair: "invert to the property -- a leaf must BE a finite real number. The three named reasons survive as SPECIALISATIONS of a refusal already decided, because 'this is a bool' tells a caller more than 'wrong type', but they are no longer the CONDITIONS for one."
    severity: the_fix_and_the_bug_were_the_same_shape
    why_this_one_is_the_most_likely_to_recur: "every other instance in this list looks wrong once seen. This one looks RIGHT. The bug was a denylist missing an entry; the fix added the entry. It closed the reported case, passed review, passed its tests, and left the class exactly as open as it found it -- narrower by one. A repair that takes the shape of the defect inherits the defect's blind spot, and inherits the credibility of having been fixed as well."
    the_question_that_separates_them: "does this repair change the RULE, or extend the LIST? Extending the list is legitimate only when the list IS the rule -- a fault-code vocabulary, a registry of operations. When the list is standing in for a property, the property is the repair."
    found_by: "applying coverage_specified_by_enumeration's own repair rule to a fix that had already been accepted"

  - name: a_justification_that_named_the_wrong_property
    target: "is this design choice justified?"
    subject: "does the stated reason sound like a reason?"
    what_happened: "the Joseph covariance update was chosen over the short form (I - K H) P on the stated grounds that the short form 'quietly loses PSD after a few hundred steps'. Mutation-tested, the short form survived every test in the operation. Measured across seven regimes: at the OPTIMAL gain the two forms are indistinguishable to every printed digit, so the step-count claim was simply false. The real guarantee is about the GAIN, not about time -- Joseph holds for any K, and the short form is a valid covariance only when K is exactly optimal. With K perturbed by 1e-3 the short form reaches lambda_min = -1.994e+06 while Joseph stays at +1.540e-02."
    why_the_mutant_survived: "not a missing assertion so much as a MISSING CASE. Nothing in the suite operated in the regime where the choice can matter, and within this operation nothing can: K is computed from an exact inverse, so it is optimal to roundoff -- twelve orders below where the forms diverge."
    repair: "state the contract over the property and test it where the property is visible. The update is now a named function whose contract is 'for any K, the result is a valid covariance whenever P_pred is', tested by calling it with deliberately suboptimal gains and judging the result with this project's own covariance gate. Deliberately NOT a test that Joseph is used: pinning an implementation is not testing a property."
    and_the_choice_was_re_justified_honestly: "Joseph is kept as a ROBUSTNESS MARGIN rather than as a fix for a live defect -- a fixed or steady-state gain, a replayed gain, a truncated inverse or a reduced-precision backend all produce a suboptimal K, and each is a change to how K is MADE rather than to the update. Claiming more than that is what the first version claimed."
    severity: a_real_property_defended_by_a_false_reason
    the_second_finding_underneath_it: "the same sweep showed the explicit symmetrisation is LOAD-BEARING, not tidiness: Joseph alone leaves 1.41e-08 asymmetry after 2000 steps and is refused by the covariance gate as NOT-SYMMETRIC. Two independent mechanisms, and removing symmetrisation then survived the perturbed-gain test -- because a suboptimal gain keeps P large and the RELATIVE symmetry budget loose. It needed the optimal-gain regime, where the covariance converges small and the budget tightens with it. Two mechanisms, two regimes, and the second was found by mutation rather than by design."

  - name: a_claim_about_the_OTHER_repository_has_no_witness_at_home
    target: "is what this artifact says about the sibling true?"
    subject: "nothing -- every check is scoped to one repository"
    what_happened: "scl_requirements.yaml said generation_depth_bounded is 'declared with status vacuously_enforced'. The acquisition layer corrected that to represented_unenforced, then to enforced when it closed the row. The compute layer's artifact was TWO corrections behind, both suites green, and the sibling had REPORTED the staleness rather than editing another repository's artifact -- the correct boundary, and also the reason the report had nowhere to land except prose."
    why_the_self_description_check_could_not_reach_it: "that check verifies an artifact against ITS OWN encoding, where the artifact and the thing described are the same object, so the artifact's bytes are their own evidence. A claim about the SIBLING has its evidence in another repository. No check scoped to one artifact can reach it, and every check this pair had built was so scoped."
    repair: "tests/test_cross_repository_claims.py, in the acquisition repository because it is the only side holding both the mirrored artifact and its own invariant ledger. Invariant ids and the status vocabulary are DERIVED from that ledger, so an invariant added later is covered without anyone adding it."
    the_distinction_the_check_had_to_preserve: "a superseded status is not automatically a defect -- this pair deliberately retains dated measurements. So a superseded status RETAINED WITH THE CURRENT ONE STATED BESIDE IT passes, and a superseded status STANDING ALONE fails. Both are expressible and only one is a defect."
    severity: two_corrections_behind_with_every_suite_green

  - name: a_clause_that_named_the_wrong_actor
    target: "does the party who must act know that they must?"
    subject: "is the obligation written down somewhere?"
    what_happened: "polymer_acquisition_readiness.yaml called `the EXTRACTOR emits one Record per RUN` the one irreversible precondition. Extractors do not emit Records: run_scout builds exactly one per RawDocument and hands it TO the extractor. The granularity is the ADAPTER'S."
    why_it_is_the_worst_shape_a_clause_can_have: "an author who read that sentence and wrote only an extractor would have VIOLATED the precondition while believing they had satisfied it. Compliance and violation look identical from inside the clause. Every other defect in this file is visible to someone who looks; this one is invisible to the person doing exactly what they were told."
    it_is_not_a_wording_slip: "the clause was ENFORCED -- there is a gate, and it fires. It fires on the wrong boundary. A clause naming no actor is vague and gets questioned; a clause naming the wrong actor is precise and gets obeyed."
    how_it_was_found: "by a concurrent session building the acquisition path the clause governs. Not by re-reading it -- reading it again produces the same wrong picture, because the sentence is internally coherent."
    repair: "bind the corrected clause to a test that RE-MEASURES run_scout's granularity rather than re-reading the sentence. A clause about who does what is checkable only against what the code actually does."
    the_general_form: "FOR ANY OBLIGATION, NAME THE ACTOR AND THEN GO AND CHECK THAT THE ACTOR IS THE ONE WHO CAN DISCHARGE IT. An obligation placed on a party that lacks the capability is satisfied vacuously by that party and violated invisibly by the one that has it."
    the_diagnostic: "trace the mechanism, not the sentence. If the named actor's code cannot produce the outcome, the clause is on the wrong layer no matter how precisely it is written."
    severity: an_author_following_the_clause_exactly_would_have_broken_the_unrepairable_precondition
    found_by: "a concurrent session building the path the clause governs"

  - name: a_stale_reproduction_looks_exactly_like_a_measurement
    target: "what does the code under test do now?"
    subject: "what does my reconstruction of it do?"
    what_happened: "checking whether a gate claim was false, a reproduction was written from memory of the content shape and run against the live gates. It reported a refusal -- MISSING_VARIABLE_IDENTITY, VARIABLE_IDENTITY_UNDER_A_RETIRED_NAME -- and the finding `even the one gate my test applies now refuses` was one sentence from being published. The reproduction used the RETIRED key name; a concurrent session had migrated the content days earlier. The real test content passes that gate."
    why_it_is_dangerous: "a stale reproduction has every surface property of a measurement. It executes, it prints numbers, it is deterministic, it can be re-run, and it is genuinely about the live code. It is simply about the code plus an input the world no longer produces -- and nothing in the output says which half is stale."
    what_made_it_worse_here: "it CONFIRMED the direction of the finding under way. The claim being checked was that a gate assertion overreached; the stale reproduction said so, more strongly. A result that agrees with the hypothesis is the one that gets published without a second look, which is the same mechanism as the forced-answer instance in this file."
    how_it_was_caught: "the test it claimed to reproduce was PASSING. Two statements about the same content that cannot both be true is the cheapest possible tell, and it only appears if you check the reproduction against the thing reproduced rather than against the source."
    the_general_form: "WHEN REPRODUCING A CLAIM ABOUT CODE OTHERS ARE CHANGING, DERIVE THE INPUT FROM THE CODE, NOT FROM YOUR PICTURE OF IT. Read the fixture the test builds; do not rebuild it. A reproduction is a second implementation, and a second implementation drifts."
    the_diagnostic: "before believing a reproduction, run the thing it reproduces. If they disagree, the reproduction is the suspect -- it is the newer and less reviewed of the two."
    severity: a_near_miss_that_would_have_published_a_refusal_that_does_not_happen
    found_by: "the reproduced test passing while the reproduction refused"

  - name: a_case_that_does_not_distinguish_the_property_from_its_negation
    target: "does the property hold?"
    subject: "does this particular example produce the expected number?"
    what_happened: "the most frequently recurring instance in the project, and the last to be named. A test asserts a real property on an example where the property and its negation give the SAME answer, so it passes either way. Every occurrence was found by a mutation surviving, never by reading the test."
    the_measured_recurrences: "four still recorded in the code that fixed them, plus one this week. native/tests/test_covariance.cpp:186 -- symmetry scale-invariance asserted on examples where relative and absolute tolerance agree; native/tests/test_kalman_analytic.cpp:130 -- F P F vs F P F-transpose, where every analytic anchor was SCALAR so the transpose was invisible; native/include/scl/kalman.hpp:31 -- the Joseph-form property, which survived every test in its own operation; the PSD relative-vs-absolute mutant, predicted to survive by the reviewer before it did; and an absolute `chi^2 > 1.0` where the case gives 0.033 and the real signal is 0.033 against 2.1e-26."
    why_it_recurs_more_than_any_other: "writing a discriminating case requires knowing HOW the property could be false, which is strictly harder than knowing that it is true. The natural example is drawn from the property holding, and an example drawn that way agrees with the negation by default. Nothing about writing the test feels wrong."
    the_diagnostic: "for each assertion, ask what the implementation would have to DO for this line to fail. If the answer is `something no plausible defect does`, the case is not discriminating. And if the assertion is an inequality against a number you chose rather than one the case produced, it is a threshold, not a measurement."
    the_general_form: "A THRESHOLD IS A NUMBER YOU CHOSE; A CONTRAST IS A NUMBER THE WORLD PRODUCED. Assert the difference between the property holding and not holding -- run both, compare them -- rather than a bound on the case where it holds. The scale of the contrast is then evidence, and it survives a change of units, a change of magnitude and a reviewer who does not share your intuition for what counts as large."
    what_it_costs_to_get_right: "one extra run of the same check on the negated case, which is why the repair is always cheap once the shape is seen and never suggests itself before."
    severity: the_most_recurrent_instance_in_the_record_and_the_last_one_named
    found_by: "a reviewer counting how many times the same correction had been made without ever being filed"

  - name: the_design_of_the_measurement_forced_its_answer
    target: "what is the correlation between these two quantities?"
    subject: "what happens to two smooth functions of one number when you vary the number?"
    what_happened: "gap 2's direction turns on rho = corr(ln Mn, ln Mw), so a GPC forward model was built and rho measured under each error mechanism. Three of the four came back at +1.0000 -- calibration offset, calibration slope, baseline. The number is correct and it is not evidence: each of those mechanisms is ONE SCALAR PARAMETER, so ln Mn and ln Mw are two smooth functions of one number and their correlation is +-1 to first order BEFORE ANY CHEMISTRY ENTERS."
    what_makes_it_dangerous_rather_than_merely_wrong: "it agreed with the hypothesis. The expectation was that rho is high because the moments share a chromatogram, and the degenerate design returned exactly that, at four decimal places, four times. A wrong answer that contradicts you gets investigated; a forced answer that confirms you gets published."
    how_it_was_caught: "the fourth mechanism -- per-slice detector noise, 800 independent parameters -- returned 0.9625 rather than 1.0000. One mechanism differing from the others by its PARAMETER COUNT rather than by its physics is the tell. The three that agreed were the three with one degree of freedom."
    the_repair_is_not_a_better_model: "it is counting the degrees of freedom in the PERTURBATION before reading the correlation out of it. The conclusion was then rebuilt on the single non-degenerate mechanism, which is also the one least favourable to it -- and the finding survived, at 0.96 against a crossover of 0.71."
    the_general_form: "A DESIGN WITH FEWER FREE PARAMETERS THAN THE RELATION IT MEASURES RETURNS THE RELATION IT WAS BUILT WITH. Before believing a measured dependence, count the independent inputs the measurement actually varied: k inputs cannot exhibit more than k dimensions of variation, so any relation of higher order is supplied by the design and not by the system. A correlation from a one-parameter sweep, a rank from a rank-one perturbation, a covariance from a scalar knob."
    the_diagnostic: "vary the parameter count, not the parameter. If the answer moves when you add independent inputs and the physics has not changed, the earlier answer was the design talking."
    severity: a_confirming_number_at_four_decimal_places_that_no_experiment_produced
    found_by: "noticing that the one mechanism which disagreed differed from the others in parameter count rather than in physics"

  - name: the_aggregate_was_counted_as_evidence_for_each_of_its_members
    target: "how much evidence is there for THIS item individually?"
    subject: "does this item's token appear on a line?"
    what_happened: "the STE reconstruction derives a citation index by scanning the vendored documents for `I<n>`. The spec's only mention of two of those invariants is the RANGE `I1-I8` -- and that string contains `I1` and `I8` as substrings, so an unmasked scan credited the range to both endpoints as though each had a citation of its own. I1 came back with evidence. Its evidence was the range."
    the_direction_is_the_finding_not_the_bug: "the error is ANTI-CORRELATED WITH WARRANT. An item already cited six times gains one spurious citation and nothing changes. An item cited nowhere individually gains its ONLY citation -- so the false evidence is the whole of its evidence base. The inflation is largest exactly where confidence is least justified, which is the opposite of how a measurement error is usually assumed to distribute."
    why_it_would_have_survived_review: "the index was RIGHT about six of the eight, and right in the way that is easy to check -- the citations it found for I5 are real and quotable. A scan that is correct wherever you spot-check it, and wrong precisely where there is nothing to spot-check against, does not read as broken."
    the_general_form: "WHERE A NOTATION HAS AN INDIVIDUAL FORM AND AN AGGREGATE FORM THAT CONTAINS IT, AN UNMASKED SCAN COUNTS THE AGGREGATE AS EVIDENCE FOR EVERY MEMBER. Ranges (I1-I8), qualified statuses (vacuously_enforced contains enforced), namespaced ids, versioned names, plural forms. The diagnostic: for each token your scan matches, ask what LONGER token contains it, then ask whether the longer one means something you are not counting."
    the_repository_had_already_met_this_class_and_handled_it: "tests/test_cross_repository_claims.py matches status words with `(?<![\\w])<status>(?![\\w])` so `enforced` does not fire inside `vacuously_enforced`. Same shape, guarded there, unguarded here -- and the guard that works for a word boundary does NOT work for a range, because both endpoints of `I1-I8` are genuine word-bounded tokens. The class recurred in a form the existing defence could not reach."
    repair: "collect the aggregates FIRST, mask their spans out of the line, then scan for individuals in what remains. The aggregate is recorded separately as an aggregate, so nothing is lost -- the range is still evidence, just evidence OF A RANGE."
    what_makes_the_repair_checkable: "the test does not read the prose beside the index. It asserts that the set of invariants the reconstruction calls UNRECOVERABLE equals the set the index says is covered only by a range, and that no unrecoverable one has an individual citation. Two derived sets compared to each other; the prose cannot drift away from the data without failing."
    severity: the_least_supported_item_appeared_to_be_supported_and_no_spot_check_would_have_shown_it
    found_by: "reading the generator's own output and noticing that the invariant the prose called unrecoverable had a citation listed"

  - name: a_pin_that_ratified_the_state_it_should_have_caught
    target: "does the record still describe the repository?"
    subject: "does the record still say what it said last time?"
    what_happened: "the generality probe's recursive_computation FAIL went stale when the invariant it measured was implemented, and `test_the_probe_records_the_failure_rather_than_a_pass` asserted `PROBE['outcome']['failed'] == ['recursive_computation']`. The repair turned nothing red. The pin and the staleness AGREED WITH EACH OTHER."
    why_it_is_not_the_same_as_a_check_failing_to_fire: "no check failed. Both mechanisms behaved exactly as written, and the suite reporting green was CORRECT behaviour from both -- the record said X and the test asserted the record said X. Two mechanisms mutually confirming a false state produce a stronger green than one mechanism producing none, because the agreement reads as corroboration."
    what_the_pin_was_actually_asserting: "not that the property held. That the RECORD had not changed. A test written over a measurement freezes whichever direction the measurement was pointing when it was written -- so it defends a true result and a stale one with identical force, and cannot tell you which it is defending."
    the_diagnostic: "for any test that asserts on a recorded measurement, ask what happens when the WORLD changes and the record does not. If the answer is that the test still passes, the test is pinning the record, not the property. A pin is correct only where the record is the thing under test -- a chain link, a retained prior value, a digest -- and wrong wherever the record is a reading of something else."
    repair: "assert the SHAPE the record must have rather than the value it happens to hold. The rewritten test requires that the FAIL not be reachable by deletion -- prior_verdict, prior measurement, and what closed it must all survive -- and the verdict itself is gated by a digest over the invariants, which goes red when the world moves instead of freezing what the record said last."
    the_general_form: "A TEST OVER A RECORDED MEASUREMENT PINS THE RECORD, NOT THE PROPERTY. Where the measurement can go stale, something separate must watch the thing measured; the pin cannot, because from inside it a stale record and a true one are the same bytes."
    severity: two_mechanisms_agreeing_on_a_false_state_with_every_suite_correctly_green
    found_by: "reconciling two probe runs and noticing that repairing the invariant had turned nothing red"

  - name: the_check_that_ended_a_coverage_failure_was_itself_enumerated
    target: "does any document in this pair make a stale claim about the sibling?"
    subject: "do the two documents someone listed make one?"
    what_happened: "tests/test_cross_repository_claims.py was built precisely because a claim about the sibling had no witness at home. Its header says DERIVED, NOT LISTED -- and it is, for the invariant ids and the status vocabulary. The DOCUMENTS it sweeps were two: scl_requirements.yaml and daq_requirement_response.yaml, the artifacts someone had thought of."
    what_the_widened_sweep_found: "three real stale claims standing alone, all about generation_depth_bounded, all reporting a status two corrections behind, in the joint DECISION RECORD, the capabilities artifact and architecture/structured_uncertainty.yaml. The enumerated version reported green over all three, including one inside a hash-bound record whose own rule says it must be reissued rather than edited."
    why_it_is_worth_a_separate_entry: "this is coverage_specified_by_enumeration occurring INSIDE the check written to end a coverage failure, by the author who had just named the class. Deriving the hard axis and listing the easy one is the shape: ids and vocabulary felt like the risky part, so they were derived, and the file list felt like context."
    the_diagnostic_that_found_it: "the general form from the entry above -- name the event the policy fires on, then ask what goes red when it happens. A status moving in this repository is the event; nothing outside two named files went red."
    repair: "the domain is every YAML document the repository holds outside vendor/. A document is covered by BEING A FILE, so a decision record, a probe or an artifact nobody has invented yet is in scope without anyone remembering."
    the_precision_limit_and_its_disposition: "the status vocabulary overlaps ordinary English -- `blocked` and one other are statuses AND words -- so a text using one as a word is flagged. Measured: distance does not separate the cases, since the false positive sat inside one sentence while a real claim spanned two. The disposition is to REWORD THE PROSE, never to teach the check an exception: an exception is a permanent hole in a check whose whole value is that it has none, and it gets added by whoever is annoyed rather than by whoever measured. A false positive costs a wording change and stays visible; a false negative is the defect the check exists for."
    severity: three_stale_cross_repository_claims_behind_a_green_check_one_of_them_in_a_bound_record
    found_by: "applying the general form recorded in the entry below, on the same day, to the checks rather than to the documents"

  - name: the_probe_had_a_gate_and_nothing_read_it
    target: "does the probe's result still describe the repository?"
    subject: "does the probe file parse and say something?"
    what_happened: "architecture/_probes/generality.yaml carries one line of policy -- `gate: re-run whenever a core invariant changes`. It was declared in Phase 36 and read by NOTHING. `generation_depth_bounded` moved from represented_unenforced to enforced at 6f890e5, with an implementation and a 36-test suite. The probe's recursive_computation FAIL had been measured against the state before that commit and was never re-run."
    why_it_stayed_invisible: "two later commits edited that very file to record two other probe runs and walked past the stale FAIL, and a test PINNED it -- `assert PROBE['outcome']['failed'] == ['recursive_computation']`. So repairing the invariant turned nothing red. The suite was green BECAUSE the record was stale: the pin and the staleness agreed with each other."
    the_shape_it_repeats: "the probe found `generation_depth_bounded` DECLARED AND NEVER IMPLEMENTED, and was itself declared and never implemented. A verification instrument is not exempt from the class it measures, and this one caught the shape in the substrate about thirty commits before having it."
    what_makes_a_stale_probe_worse_than_a_missing_one: "`outcome.bent`, `outcome.untested` and `outcome.failed` are cited as LIVE claims -- architecture/core.yaml calls `bent: []` an assertion about the core. A probe with no result is visibly silent. A probe with a dated result reads as current, and the citation carries the date nowhere."
    repair: "enforce the declared gate with the mechanism this pair already uses -- a digest that moves. A projection of (id, rule, status) over every invariant, recorded in the probe and recomputed by tests/test_generality_probe_gate.py, so the re-run instruction arrives as a red test rather than as a thing to remember. Derived by walking for the SHAPE of an invariant entry, not from a list of the ones the probe happens to depend on: that list would go stale exactly the way the result did."
    shown_capable_of_failing_against_real_history: "not a synthetic mutation. Recomputed over `git show 6f890e5^:architecture/invariants.yaml`, the projection digest differs from the current one, so this gate would have gone red at the repair commit and forced the re-run before either probe run was written on top of a stale result. The test asserts that difference rather than quoting it."
    the_limit_is_declared_rather_than_discovered: "the projection sees ids, rules and statuses. A repair that lands code without moving a status is outside it, and so are the non-invariant surfaces two of the five results actually rest on -- the science/ gates and the evidence store. Recorded in gate_enforcement.what_it_does_not_cover, because a gate that overstates its reach is worse than a narrow one: the overstatement is what gets cited."
    the_general_form: "A POLICY LINE IN A DOCUMENT IS NOT A GATE. Every re-run condition, expiry, refresh rule or 'must be revisited when X changes' written in prose is unenforced until something recomputes it. The diagnostic: name the event the policy fires on, then ask what goes red when it happens. If the answer is a person remembering, the policy is decoration."
    severity: a_probe_whose_results_are_cited_as_current_was_two_commits_dated
    found_by: "reconciling two probe runs and reading the outcome block they were being added to"

  - name: the_immutable_referent_was_recorded_and_the_mutable_one_was_joined_on
    target: "is this artifact extending the core it was written against?"
    subject: "does its version label match the version label?"
    what_happened: "32 artifacts declare `extends: core@1.0.0`, the doctrine projection prints it, and `bent: []` is a claim made RELATIVE to a core. All of them joined on the VERSION -- the one field upstream controls and can move. `submodule_commit`, which cannot move without the vendored code changing, was recorded in core.yaml and read by NOTHING."
    the_silent_case_that_makes_it_urgent: "not a version bump, which is loud. A submodule bumped to a commit whose pyproject STILL SAYS 1.0.0 -- what a patch commit looks like. The recorded commit is then wrong, every check passes, and all 32 extends agree with each other about a core that moved underneath them."
    the_check_that_existed_was_also_weak: "the one version check was a SUBSTRING match over the whole pyproject text, which cannot distinguish the [project] version from a dependency pin, a tool table or a comment. Replaced by a parsed lookup."
    repair: "declare which field is which, in the vocabulary this project already has: the submodule commit is PARTICIPATING, the version is ANNOTATING, and a join on an annotating field is the defect. The label is kept -- 32 artifacts read it and a commit hash is not a readable claim -- but it is verified AGAINST the participating referent rather than standing in for it."
    the_general_form: "wherever an identity has a stable component and a human-readable one, the readable one will be the one that gets joined on, because it is the one that appears in the text. Recording the stable one is not enough; something has to READ it."
    severity: every_core_relative_claim_rested_on_a_field_that_can_move
    found_by: "asking what a reference actually refers to before deriving anything else from it"

  - name: a_test_that_asserted_more_than_its_recorded_expectation
    target: "did the pre-registered prediction hold?"
    subject: "did the narrower thing the run happened to check hold?"
    what_happened: "the revocable-record probe recorded the observable as 'the store refuses, OR the original bytes survive unchanged'. The run asserted only the exception. None was raised, the bytes DID survive, and the run reported that content-addressing is not enforced on write and every digest in the pair is unreliable -- a prediction that held, reported as catastrophically failing."
    why_it_is_not_the_same_as_restating_thresholds: "the run READ the expectation file correctly. It then checked something narrower than what it read. A pre-registration binds only if the run is faithful to it, and faithfulness is not established by reading -- the same distinction as a digest check that verifies bytes against a sidecar both of which moved together."
    the_second_defect_underneath_it: "the stimulus reached past the public API. put_observation derives the id FROM the observation, so no caller can supply a mismatched pair; the forgery required the private _write. An outcome produced by bypassing the public surface is not evidence about the public surface -- the cohort probe's lesson, arriving in the next probe, and this time it would have been a serious FALSE claim rather than an inverted one."
    what_caught_it: "the expectations had flagged that specific outcome as bigger than the probe's scope, so it was re-examined before being reported. A predicted catastrophic result is the one to check hardest, not the one to publish fastest."
    repair: "assert the recorded observable in the form it was recorded -- including its disjunction -- and split the genuinely reachable behaviour into its own case rather than folding it into the one that overreached."
    severity: a_held_prediction_reported_as_a_catastrophic_failure

  - name: a_gate_applied_to_content_it_does_not_govern
    target: "was the planted violation refused by the mechanism it was planted for?"
    subject: "was it refused?"
    what_happened: "the cohort-identity probe fed TABLE-shaped content to gates that govern the PROPERTY shape. Four of five plantings refused -- MISSING_PROPERTY, MISSING_METHOD, MISSING_UNCERTAINTY_KIND, UNTYPED_QUANTITY -- and a fifth refused for an out-of-vocabulary uncertainty_kind. Every one of those refusals is about the SHAPE being wrong for the gate being asked, and none is about the property under test."
    what_counting_would_have_concluded: "that the substrate REFUSES polymer observations. The opposite of the truth, produced by a run in which every gate behaved correctly and every refusal was real."
    why_it_is_its_own_shape: "a reachability proof's whole content is that a specific mechanism engaged. A refusal is evidence only for the mechanism that produced it, and a gate answering a different question produces refusals that are not evidence for anything asked. Adjacent to a_check_that_read_its_own_input, but the failure here is in the STIMULUS rather than in the check: the wrong question was posed, correctly answered, and the answer counted."
    repair: "name the expected id per case, so `refused` and `refused by the predicted mechanism` are different results; and show each gate only the content shape it governs, since the shapes are not interchangeable. Both were needed -- the id naming made the mistake visible, the shape separation removed it."
    severity: a_correct_refusal_that_was_evidence_for_nothing
    found_by: "the probe's own predicted-id comparison, on the first run, before any conclusion was drawn"

  - name: a_check_that_read_its_own_input_as_its_own_authority
    target: "does this alias denote the party it claims to?"
    subject: "is the alias absent from a set the alias itself defines?"
    what_happened: "the cross-repository join asserted that ANSWERED equals SELECTED, which is self-consistency and not identity: an alias naming the WRONG party selects that party's rows, and a response answering exactly those rows passes. Probed with a verbatim quote, that case went straight through -- the earlier probe had been caught only by the quote check, which masked it."
    the_fix_was_circular_and_passed_its_own_probe: "the first repair derived the counterparty's names as 'every owner token not in `tokens`'. `tokens` contains the alias, so the very token under test excluded ITSELF from the set meant to catch it. Re-running the probe reported PASS, and it would have been recorded as closed."
    what_made_it_visible: "re-running the exact probe after the fix, rather than re-running the suite. The suite was green before the fix and green after it, and only the probe distinguishes those two greens."
    repair: "anchor the derivation to something that does not move when the alias moves -- the DECLARED SELF -- and read only TOP-LEVEL artifact ownership, since a top-level owner says whose artifact this is while an owner inside a requirement row says who a row is ADDRESSED to. The counterparty's self-name is then derivable and the alias cannot claim it."
    why_it_belongs_beside_the_others: "every instance here is a check whose subject drifted from its target. This one is the degenerate case: the subject became a function OF the target, so the check could not disagree with what it was checking. A proof that consults the claim as its own evidence."
    severity: the_repair_verified_itself_and_reported_success

  - name: one_party_two_names_and_nothing_joined_on_the_token
    target: "did the response answer the rows addressed to it?"
    subject: "do the owner strings match?"
    what_happened: "the acquisition layer calls itself `daf` in all six of its own artifacts; the compute layer addresses all eight of its requirement rows to `daq`. Both internally consistent, so NO CHECK INSIDE EITHER REPOSITORY COULD SEE IT. It became visible the first time something JOINED on the token, which was the cross-repository check above, on its first run."
    the_failure_mode_it_would_have_had: "matching rows by owner would have selected NONE, and an empty answered set compares equal to an empty upstream set -- so the artifact would have read as fully answered while answering nothing. A vacuous pass produced by a vocabulary mismatch rather than by an empty domain."
    repair: "the party declares its own correspondence -- `also_known_as` in the acquisition layer's own artifact -- and the check reads it rather than assuming identity. Not fixed by renaming: it is that repository's own name, so the counterparty renaming its rows would be one side deciding the other's identity, and both tokens sit in hash-bound artifacts. The check also asserts the upstream set is non-empty, so the vacuous path is closed independently of the naming."
    a_case_where_a_list_IS_the_property: "a two-entry party vocabulary is closed -- there are two parties -- so a declaration here is not an enumeration standing in for a property. Recorded because this file otherwise reads as if every list were a defect."
    severity: a_vacuous_pass_waiting_for_the_first_join

  - name: an_enforcement_claim_that_names_a_file_saying_nothing_about_it
    target: "is this invariant enforced?"
    subject: "does the ledger name a test file that exists?"
    what_happened: "generation_depth_bounded named an enforcement file containing nothing about it and stayed green for 35 phases. Measuring it found 17 other invariants in the same state. Caught again in THIS phase: the new invariant added for the shadowed-test rule named its guard, and the guard did not mention the invariant."
    repair: "tests/test_recursive_lineage_depth.py -- the named file must MENTION the invariant id, with the pre-existing set locked so it cannot grow. A deliberately weak bar: it is the bar the ledger's own claim of enforcement should already clear, and 18 entries did not."
    severity: enforcement_claimed_and_absent
    note: "the only instance in this list caught by an existing guard rather than by the phase that introduced it. That is the shape the rest of this file is trying to produce."

  - name: shadowed_test
    target: "do these tests pass?"
    subject: "does the module's namespace, after import, pass?"
    what_happened: "three functions were redefined later in the same file. Python keeps the last binding, so the earlier three were dead code, and pytest -- which collects a namespace, not a source file -- reported 82 collected and green while three of them did not exist. A shadowed test is not a failing test, it is an ABSENT one. One of the three called a name the repository does not define, so it could not have run even unshadowed: a two-parser agreement check had been written, reviewed, committed, and never once executed."
    repair: "tests/test_no_test_name_is_shadowed.py -- refuse any module binding a test name twice, read from SOURCE via AST, because the imported module is exactly where the evidence has already been destroyed."
    severity: undermined_the_evidence_for_every_other_repair_in_the_phase

  - name: a_property_stated_in_an_artifact_is_not_a_property_enforced_by_one
    target: "does this reissue name the fixture it replaced?"
    subject: "nothing -- no check read the field"
    what_happened: "one repository's record named the NEW fixture as its own predecessor (a self-link); the other never moved the field at all (a skipped link). The two records disagreed while both suites were green."
    repair: "two tests -- one rejecting a self-link, one checking the named predecessor against committed git history rather than against the record's own say-so. A record is not an oracle for its own provenance."
    severity: silent_divergence_between_repositories

  - name: verify_certified_the_corruption
    target: "was this stored file tampered with or corrupted?"
    subject: "does the id recomputed from these fields match the id stored beside them?"
    what_happened: "a file containing a bare NaN was read back, its id recomputed, and _verify PASSED -- correctly by content_hash's own rules, because hashing is deterministic over whatever bytes it is handed. The check did not fail to catch the corruption; it certified it. The value so certified was not equal to itself, and the bytes are not JSON, so the id was reproducible by exactly one implementation. The module docstring claimed on-disk corruption 'is caught on read rather than trusted'."
    repair: "strict_json_loads at every reader whose writer already refuses. And the general form: recomputation succeeding is not the property wanted -- INDEPENDENT recomputability is."
    severity: an_integrity_check_that_blessed_the_thing_it_guarded_against

# ------------------------------------------ what convergence is worth --

  - name: a_self_describing_artifact_lying_about_its_own_encoding
    target: "is this artifact what it says it is?"
    subject: "does the artifact match its digest?"
    what_happened: "daq_capabilities.yaml carries a canonicalization block DESCRIBING the rules it was emitted under. That block went stale through TWO coordinated reissues: it stated the pre-always-quote string rule -- the one the FIRST reissue replaced -- and named a shared-fixture digest from before both. Every integrity check in both repositories passed the whole time."
    why_no_digest_check_could_catch_it: "THE CONTENT AND THE ENCODING DISAGREED, AND THE DIGEST IS OVER THE CONTENT. Both reissues recomputed the hash correctly and both sidecars matched. The stale claim WAS content, so hashing it faithfully is exactly what a correct digest does. There is no arrangement of digest checks that sees this."
    why_it_is_its_own_shape: "every mechanism this pair has built verifies an artifact against its DIGEST, and none verified one against its own CLAIMS. That is a gap in the kind of thing being checked, not a gap in coverage of a known kind."
    repair: "assert equality between each self-descriptive claim and the fact it describes. The claims were already checkable -- a named file exists or does not, a quoted digest matches the sidecar or does not, a stated string rule matches emitter behaviour or does not. Nothing new had to be measured; something had to be COMPARED."
    the_check_is_driven_by_the_claims: "each claim is bound to a verifier BY NAME and a claim with no verifier fails, so the next field added to the block cannot be silently unchecked. Hand-listing the assertions would have been the enumerated form, in the file that names it."
    verified_by_planting_the_defect: "both real staleness cases are replayed against the verifiers that now cover them, plus a third the block would have hidden the same way. A lying artifact is also constructed and shown to be perfectly self-consistent under every digest check that exists."
    enforcement: tests/test_self_description_matches_the_artifact.py
    severity: an_artifact_that_certified_correctly_while_describing_a_rule_it_was_not_emitted_under

  - name: a_measured_fact_recorded_in_prose_has_nothing_defending_it
    target: "is the recorded reason for this defect the measured one?"
    subject: "does the prose read plausibly?"
    what_happened: "the acquisition half MEASURED the collection defect correctly -- the compact single-element form is silently mistyped, and architecture/canonicalization_defect.yaml has said so since 88248ac, unchanged. The compute half probed the multi-element form, which raises, and recorded a loud refusal. The merge then adopted the compute half's serializer WHOLESALE on a behavioural-equivalence check, and the adopted file's prose carried its reason -- silently replacing a correct measurement with an incorrect one, in the same repository that still held the correct one."
    what_no_test_covered: "the claim. Behavioural equivalence was verified and held: byte-identical output across every document, identical refusals. Nothing compared a code comment to an architecture record, and nothing could, because a reason recorded in prose is not bound to anything."
    why_it_is_worse_than_two_authors_agreeing: "a second author agreeing adds no coverage. A merge REPLACING a correct measurement is worse than that -- it removes coverage that existed. The repository knew the right answer and stopped saying it."
    repair: "behavioural equivalence licenses taking the other side's CODE. It does not license taking their ACCOUNT OF WHY. Where a reason is load-bearing, bind it: the emitter's refusal message and the architecture record now state the same measured shapes, and the tests pin both."
    severity: coverage_that_existed_was_silently_removed

  - name: the_presence_check_fetched_the_object_whose_absence_was_the_finding
    target: "do these three commits belong to one history?"
    subject: "does `git cat-file -e <commit>` succeed in this checkout right now?"
    what_happened: "a draft ecosystem register reported that the three core commits on this machine SHARE NO OBJECTS -- a stronger claim than staleness, and it was published as the register's central finding: that the relationship between the three could not be determined from here at all. It was established by running `git cat-file -e` for each commit inside ste-clean and watching all three fail. All three are one history. acdde14 is an ancestor of 5e146d5, which is an ancestor of the remote head, and the remote serves every one of them."
    the_mechanism: "ste-clean is a PARTIAL CLONE -- remote.origin.promisor true, partialclonefilter blob:none. In a partial clone a presence query is not a read. On a local miss git fetches the object from the promisor remote and answers yes. Re-running the identical question with FULL shas instead of abbreviated ones returned `commit` for all three, and two new promisor packs appeared in .git/objects/pack timestamped inside the same minute as the query. The objects were there because they had been asked about."
    why_the_first_run_answered_differently_from_the_second: "abbreviation. A short sha must be resolved against the LOCAL object database before any fetch can be attempted, so it misses locally and never reaches the lazy path; a full sha goes straight to the promisor. The difference between the run that produced the finding and the run that destroyed it was seven characters."
    and_the_same_trap_sprang_twice_in_one_artifact: "the enforcement test written to close this then verified recorded referents with `git fetch <url> <sha>` -- which also requires the full forty characters, because the throwaway repository doing the fetch has no object database to resolve an abbreviation against. All six members reported `no longer served`: six false alarms, one cause, the same cause. The register now records every remote referent unabbreviated."
    what_no_check_covered: "that the measurement was read-only. Every check in both repositories asks whether an answer is CORRECT. Nothing asked whether obtaining it was free of side effects, and in a partial clone it is not."
    repair: "GIT_NO_LAZY_FETCH=1 on every git invocation in tests/test_ecosystem_register.py, set in one helper -- and a test that reads the test file's own source and fails if any git call is written around that helper. The guard is not the environment variable; the guard is that the variable cannot be quietly stopped being used."
    severity: a_published_finding_that_was_an_artefact_of_the_instrument
    why_it_belongs_to_the_write_side_effect_class_and_sharpens_it: "the class already here describes a check that dirtied a tree it was not asking about -- the observer disturbing its surroundings. This one is narrower and worse: the check supplied THE VERY OBJECT whose absence was the finding. Not an observer that disturbs what it observes; an observer that manufactures it."
    the_general_form_worth_carrying: "before trusting a measurement, ask what OBTAINING it costs. `Is X present` over any lazily-materialising store -- a partial clone, a cache with a read-through, an ORM with lazy loading, a filesystem with an automounter -- is a question whose asking can make the answer true. The existing rule says ask what a check WRITES. This extends it: ask what a check MATERIALISES, which is a write the check does not contain and cannot be found by reading it."
  - name: a_clean_merge_is_not_evidence_that_two_changes_are_compatible
    target: "do these two branches of work fit together?"
    subject: "does git report a textual conflict?"
    what_happened: "two sessions, working the same night on the same instruction, each wrote an ecosystem record for this repository -- architecture/ecosystem_census.yaml and architecture/ecosystem_register.yaml. Same subject, overlapping claims, different method. Git merged them with conflicts in exactly two files, both DERIVED artifacts regenerated seconds later. The genuine duplication -- two records of one subject, two enforcement tests, two accounts of the core identity -- produced no conflict at all, because they had different filenames."
    what_no_check_covered: "that a repository holds ONE record of a subject. Every gate here is scoped to an artifact: does it parse, does it match its digest, does it declare its core, is it a fixed point of its generator. Two artifacts each passing all of theirs is the exact state that arises, and the pair already has a rule for it -- two checks passing is not the property holding -- reached here at the level of whole documents rather than assertions."
    and_the_two_disagreed_in_a_way_the_merge_could_not_see: "the census recorded the ancestry of the core as undeterminable because the pinned commit was `not in the object database`; the register had measured that this reason is an artefact of a partial clone. One file said a thing the other file had already disproved, and both were committed, and the tree was green."
    what_each_had_that_the_other_missed: "the census named `notationsystems/data-acquisition-fabric`, a fourth name for this repository that the register never tested -- because the register derived its candidate names from the remotes of checkouts present on the machine, an enumeration over a source that cannot contain a name nothing points at. The register had the remote measurements the census declared unverifiable. Neither was a subset of the other."
    repair: "keep both, bind them, and give each an explicit scope the other names -- the census owns apparatus roles and the BOUND/OBSERVED split, the register owns remote identity and posture. Then correct the disagreement in the file that held it rather than deleting it. UNIONING FIXTURES rather than choosing is the practice this record already carries from the serializer case; this is the same move applied to records."
    severity: two_records_of_one_subject_each_passing_every_gate_written_for_it
    the_general_form_worth_carrying: "before trusting a merge, ask what it CANNOT conflict on. Two files that never touch the same bytes cannot conflict however much they contradict each other, so a clean merge is evidence about text and about nothing else. The diagnostic: name the state in which this merge would have gone red. If a genuine incompatibility is not in that state, the green says nothing about it."

  - name: a_fixed_oracle_read_against_a_sample_that_moves
    target: "does the covariance estimator recover the correlation it was given?"
    subject: "is one randomly-redrawn sample within 0.05 of it?"
    what_happened: "tests/test_replicate_pairing.py drew its 4000 runs with `seed=hash(str(rho)) % 100000`. Python randomises the hash of str per interpreter, so the seed was a different number in every process -- measured, three consecutive runs of hash(str(0.0)) % 100000 gave 22807, 37619, 53489. The bound it was compared against, abs=0.05, did not move. The parametrisation at rho=0.0 failed inside a full-suite run, passed in isolation, and passed again on re-run."
    what_the_green_had_been_saying: "not `the estimator recovers rho` but `the estimator recovered rho on one sample nobody chose and nobody recorded`. The worst deviation the old form could produce was never known, because the sample it produced was never the same twice, so the margin between the measurement and the tolerance was unmeasurable by construction."
    the_repository_had_already_written_this_down: "tests/test_persistent_condition_lifecycle.py states, and demonstrates across three subprocesses, that the native hash is process-local and that asserting anything stable about it across processes asserts something Python does not promise. Correct, measured, and binding on exactly one file. The defect was in another."
    repair: "pin the seed, and DO NOT SHOP IT. The value used is the date, 20260903, the first and only one tried; best-of-forty selection was measured -- it gives |r-rho| about 0.0001 -- and rejected, because choosing the sample that best flatters the estimator is tuning the experiment to its own answer. The deviations the pinned seed actually gives are recorded beside the test: worst 0.01615 against a tolerance of 0.05, a margin of 3.1x. The tolerance was not touched."
    the_check_that_now_binds_it: "tests/test_no_test_draws_from_a_process_varying_seed.py, over every python file under tests/ by sweep. A hash() may be ASKED ABOUT -- consumed by an assert or a bare expression -- and may not be CARRIED FORWARD by an assignment into data. Its first draft used the coarser rule `hash() may not reach any call argument` and flagged two legitimate hashability probes; no exception was added for them, the rule was narrowed to the property that is actually true."
    severity: an_intermittent_failure_that_would_have_been_re_run_until_green
    why_it_is_filed_rather_than_called_a_flake: "a flake is a defect whose location has not been found. This one has a location, a mechanism, and three measured seeds. The signature -- fails once in the suite, passes alone, passes on re-run -- is the exact signature that gets a real defect retired as noise, and the retirement is cheaper than the diagnosis every single time."
    the_general_form_worth_carrying: "when a test compares a measurement to a bound, ask whether the MEASUREMENT is fixed. A moving sample against a fixed threshold is a check whose pass rate is a property of the threshold and the variance, not of the code -- it is sampling the tail of its own error distribution on every run, and it will eventually report the tail as a regression. The diagnostic: run it twice in fresh processes and ask whether the number in the failure message would be the same."

a_verification_with_a_write_side_effect_cannot_witness_what_it_verifies:
  "what_it_is": "a check that changes its own subject by running. The fixed-point tests here verify that an artifact equals what its generator produces -- by RUNNING the generator, which writes. So the act of asking the question alters the evidence, and 'did the suite pass' and 'is the tree unchanged' stop being independent questions."
  "how_it_surfaced": "a stop hook, not a test. A suite run against an UNPINNED submodule checkout rewrote two committed sidecars; the tree was dirty afterwards and nothing in the suite noticed, because the suite is what dirtied it."
  "the_concrete_defect_underneath": "the restore was PARTIAL. Each generator writes an artifact AND its sidecar; the fixed-point check snapshotted and restored only the artifact. A failing comparison therefore left a state no commit describes -- artifact as committed, digest as regenerated -- with every downstream digest check passing over a hash bound to bytes that were no longer there. Self-consistent and wrong, which is this record's recurring signature."
  "why_the_pin_bump_is_exactly_when_it_bites": "the output of these two generators is a function of the VENDORED TREE. While the pin is stable the write-back is invisible because regeneration is idempotent. The moment the tree and the index disagree -- which is the whole of a pin bump -- regeneration produces different bytes, and the partial restore turns that into a mixed tree rather than a clean failure."
  "relation_to_the_self_describing_artifact": "same family, different mechanism. There an artifact could not witness its own claims, because the digest was over the content and the claim WAS content. Here the witness alters the evidence. One is a subject that cannot testify about itself; the other is an observer that disturbs what it observes."
  "the_repair_has_two_halves_and_needs_both":
    - "the generators that read the vendored tree now REFUSE to run while that tree and the index disagree -- fail closed and loud, rather than producing an artifact derived from a commit the pin does not name. Reading the pinned commit's bytes out of git instead was considered and rejected: it would let the generator succeed while silently disagreeing with the tree a reader is looking at."
    - "the fixed-point check now restores EVERY file the generator writes, not the first one. The guard stops the wrong bytes being produced; the restore stops a legitimate failure leaving a mixed tree behind."
  "verified_by_planting_the_defect": "the submodule was checked out at head with the index still pinned, the generator was run, and it refused and wrote nothing. At the pin it regenerates identically. Both measured, not argued."
  "the_general_form_worth_carrying": "before trusting a check, ask what it WRITES. A check with no side effects can be run twice and asked whether the answer is stable. A check that writes cannot -- the second run is answering a different question."

two_correct_gates_and_an_unowned_relation:
  "what_it_is": "two checks, each correct in isolation, with no check owning the RELATION between the things they check. Not a coverage gap in either -- both were doing their jobs."
  "the_instance": "a 2x2 covariance on a SCALAR-valued measurement passed both gates independently. quantity_is_typed asked whether the uncertainty was a typed quantity and it was; the aligned-observation gate asked whether every leaf was a quantity and they were. Nothing asked whether the uncertainty's shape matched the value's, because that question is about neither field alone."
  "why_it_is_not_the_coverage_class": "adding an item to either check's list would not have found it. The missing check was not narrower than it should have been; it did not exist, and could not have been written inside either gate without that gate reaching into the other's subject."
  "relation_to_two_gates_that_must_agree": "the same shape one level up. That rule says neither gate subsumes the other and neither call may be dropped -- it is about two gates answering DIFFERENT questions about the same value. This is about two gates answering questions about DIFFERENT values whose relation nobody owns."
  "the_diagnostic_question": "for any two fields checked separately, is there a claim that only makes sense about the PAIR? Units and components. Uncertainty and value. Depth and lineage. Each of those is a relation, and a relation belongs to neither field's gate."
  "the_repair": "give the relation its own gate rather than extending either. science/structured_uncertainty.py checks correspondence and nothing else; science/lineage_depth.py checks a declared depth against the lineage it claims, which is the same shape -- a number and a structure that must agree."
  "how_the_two_instances_here_were_found": "both by asking the diagnostic question of an existing pair rather than by a failure. The covariance one came from probing whether the cell rule reached matrix cells; the depth one was the requirement itself. Neither surfaced from a red test, which is what makes the question worth asking deliberately."

reading_a_subset_as_though_it_were_the_set:
  "what_it_is": "the enumerated-coverage class applied to READING rather than to checking. A requirement list is read, a subset of it is taken for the whole, and everything downstream is reasoned over the subset. No check is wrong; no check was consulted."
  "why_it_is_filed_separately": "the repair differs, and that is the only reason it is its own entry. For a CHECK the repair is assert-the-property-not-the-enumeration. A reader cannot assert anything -- so for READING the repair is that any count of requirements is taken from the artifact PROGRAMMATICALLY, never from prose or recollection."
  "the_three_instances":
    - "least_squares: a third DAQ-owned requirement sat under condition_requirements rather than blocking_requirements. Caught by reading the workload entry whole before shipping the extension."
    - "kalman_filter_linear: FOUR requirements sat outside blocking_requirements -- ordering, stream identity, elapsed time, per-component units. Caught the same way."
    - "the blocking rows themselves: the count was carried forward as one when the artifact says two. Caught by the requirements-artifact stability check, which was run for a different reason."
  "the_common_form": "in all three the artifact was right and available, and the subset was smaller than the set in a way nothing signalled. blocking_requirements is a real field with a real meaning; it is simply not the requirement list, and nothing about reading it says so."
  "why_prose_and_recollection_are_the_failure_surface": "a count restated in prose is bound to nothing -- the same finding as a measured fact recorded in prose. Once written down, a wrong count is indistinguishable from a right one and is carried forward by everyone who reads it, including its author."
  "the_repair_is_cheap_and_is_now_in_place": "the test that already asserts requirements_still_open also asserts the COUNT, derived from the artifact. A record claiming to clear a workload while the artifact lists more open rows than the record names now fails."
  "enforcement": "tests/test_structured_uncertainty.py, tests/test_kalman_framing.py"
  "relation_to_coverage_specified_by_enumeration": "the same shape one layer out. There the check's predicate was a list someone wrote; here the reader's premise was a list someone else wrote for a different purpose. Both fail silently, both report a confident answer, and both are repaired by deriving rather than naming."
  "the_third_instance_was_the_users_own": "recorded because it matters that the class does not respect who is reading. The same subset-for-set reading was made by the party who had just named the class."

the_rate_is_itself_the_finding:
  observation: "instances of this class are being found BY the class, and faster than they are being filed. Generalizing the reissue chain check from one named artifact to a derived set found two further unchained bindings IN THE SAME COMMIT that filed the principle. Closing the cell-leaf denylist found six admitted types nobody had listed. The self-description check, written to close one instance, has a construction whose whole point is that it cannot become another."
  what_the_rate_suggests: "the enumerated form is not an occasional slip. It is the DEFAULT SHAPE of a check written under time pressure, because naming what to look at is always easier than deriving it, and it always works on the cases the author has in mind. The correct prior when reading any check in this repository is that its coverage is a list until shown otherwise."
  the_practical_consequence: "asserting the property rather than the enumeration is not a repair to apply when an instance is found. It is the construction rule for every new check, and this file's required_step -- plant the defect and watch it fail -- is what reveals which form was actually written."
  a_caution_against_the_obvious_reading: "a class that finds its own instances quickly may be a real class, or may be a lens that makes everything look like itself. The counter-evidence would be a check whose coverage is a list and which is nevertheless correct and stays correct -- a closed vocabulary, for instance, where the list IS the property. Those exist here (uncertainty_kind, the absence reasons) and are not instances. The distinction is whether the world can grow an item the list did not anticipate."

convergence_is_not_evidence:
  claim_being_corrected: "an earlier note recorded two subsystems independently deriving the same rule as EVIDENCE ABOUT THE CLASS rather than a coincidence about the phase. That note overstates, and this entry is filed next to it rather than replacing it."
  the_counter_instance: "two sessions independently closed the canonical-YAML collection class, independently reached the same refusal, by the same argument. The convergence was real and it still added no second measurement."
  the_counter_instance_corrected: "an earlier statement of this entry said BOTH halves recorded the same wrong reason. Re-checked against what each half actually measured, and it is not what happened. The compute half probed the multi-element compact form, which DOES raise, and recorded a loud refusal. The acquisition half probed single-element inner sequences, measured the SILENT mistyping correctly, and recorded it -- architecture/canonicalization_defect.yaml has carried that measurement since 88248ac, unchanged, and still does."
  what_actually_went_wrong: "the merge. The acquisition half adopted the compute half's serializer WHOLESALE on a behavioural-equivalence check, and the adopted file's prose carried the compute half's reason into a repository that still held the correct one. A correct measurement was silently replaced by an incorrect one."
  why_the_corrected_version_is_the_stronger_lesson: "not two arrivals agreeing on a wrong reason, which would be a coincidence. A merge REMOVING coverage that existed, with no test anywhere covering the claim -- because a measured fact recorded in prose is bound to nothing. Filed as its own instance above."
  what_it_actually_shows: "two authors reaching the same conclusion shows they share a method, a vocabulary, or a blind spot -- often all three. It is not a second measurement. Here the two halves probed DIFFERENT shapes and reached the same conclusion for different reasons, one of them wrong -- which is the same lesson from the other direction: the agreement was not evidence, and neither was the disagreement visible, because nothing compared the two accounts."
  demoted_to: "a PROMPT TO RE-MEASURE, not a form of evidence. Convergence raises the value of re-running the underlying measurement; it never substitutes for it."
  what_did_catch_it: "running the two readers against each other, on every shape, including the ones neither half had probed."
  the_practice_that_survives: "when two independent efforts agree, UNION their fixtures rather than choosing one -- neither set subsumed the other, and a shape nobody pins is a shape nobody agreed. That is a coverage argument, and it stands. The evidential claim does not."

# --------------------------------------- two construction rules, earned --

do_not_change_the_product_so_a_test_can_reach_a_regime:
  rule: "when a property is only visible in a regime the code cannot currently produce, expose the FUNCTION and call it with that input. Do not add a parameter, flag or hook to the shipped path so a test can steer it there."
  the_case_that_earned_it: "the covariance update's guarantee holds for ANY gain, and the operation only ever supplies the optimal one -- under which every update form agrees. Reaching the discriminating regime needed a suboptimal gain. Adding a gain-perturbation parameter to the operation would have made the test easy and would have added a way to produce a wrong filter, permanently, so that a test could run for an hour."
  why_it_is_the_counterpart_to_a_rule_already_here: "the same shape as fixing the test rather than loosening the tolerance. Both are the temptation to move the thing being measured instead of the thing measuring it -- one moves the threshold, this one moves the product."
  the_boundary: "exposing an internal function IS a change to the surface, and the distinction is what the surface now permits. A named function with a stated contract permits exactly what the contract says. A perturbation knob permits a caller to produce an invalid result on purpose."

a_mutation_set_is_a_lower_bound_not_a_proof:
  rule: "report mutation coverage as a LOWER BOUND. A mutation set is an enumeration -- the shape this file names -- and unlike the other instances it cannot be replaced by a derived property, because there is no derivable set of 'all wrong implementations'."
  why_it_is_stated_rather_than_engineered_away: "the honest response to an enumeration that cannot be derived is to say so where the result is read, not to present it as coverage. tests/mutation_check_kalman.py prints the caveat with the score."
  what_it_still_earns: "three real defects in one run that the full suite had reported green: a surviving Joseph mutant whose justification then turned out to be false, a surviving F P F^T transposition that no scalar anchor could see, and an attribution the harness disproved -- the innovation-sign mutant is caught, but not by the test that claimed it, because that case drives all-zero measurements from a zero state and cannot distinguish the sign."
  the_harness_also_caught_its_own_operator_again: "one entry in the mutation set was a DEFECTIVE MUTATION: it declared an unused variable, which is a real statement, so the textual malformed-check passed it -- and dead code, so it changed nothing and reported SURVIVED. The malformed check catches comment-only diffs, not dead-code ones. The entry is corrected and kept, and the limit is recorded rather than left as a surprise for the next reader."

a_fix_is_an_untested_assertion_until_the_probe_is_re_run:
  rule: "re-run THE PROBE THAT MOTIVATED THE FIX against the fix. Not the suite -- the probe. A suite that was green before a repair and green after it has distinguished nothing, and the probe is the only thing that separates those two greens."
  the_case_that_earned_it: "the cross-repository alias check was repaired with a derivation that excluded the alias from the set meant to catch the alias. The suite passed. The probe, re-run, ALSO passed -- and only re-running it a second time after anchoring the derivation to something that does not move with the alias showed the difference. The first repair had verified itself and reported success."
  why_repairs_are_the_harder_case: "every other instance in this file probed a NEW check, where nobody yet believes anything. A repair arrives with the strong prior that it works -- it was written by someone who had just understood the defect -- and that prior is exactly what makes skipping the re-run feel reasonable."
  the_stronger_form: "a repair whose probe passes for a NEW reason is not a repair. Re-running the probe answers whether it still fails; it does not answer whether the pass is for the intended reason. Where the two can be told apart, check the failure MESSAGE and not merely the failure."
  relation_to_the_required_step: "this file already says plant the defect and watch it fail, before trusting a pass. That was written for construction. This is the same step at repair time, which is where it was missing."

two_checks_passing_is_not_the_property_holding:
  rule: "when several checks all pass over the same artifact, ask what each one actually reads. Adjacent questions answered correctly do not compose into the question nobody asked."
  the_case_that_earned_it: "an alias naming the wrong party was caught by the VERBATIM-QUOTE check, not by the owner join it was probing. The join passed. With a correct quote -- which costs nothing to produce -- the case went straight through both. Two independent checks passing had established neither's property, because each was answering something adjacent to it."
  the_diagnostic: "for each check, name the state in which it FAILS. If the state you care about is in no check's failure set, the greens are unrelated to it however many there are."

# ------------------------------------------- the sharpest sub-family --

coverage_specified_by_enumeration:
  proposed_by: "the acquisition layer, independently and in the same phase, as a core-vocabulary candidate on the same footing as absent-is-not-zero and one-meaning-one-encoding. Its formal statement lives in architecture/exchange/daq_capabilities.yaml under core_vocabulary_candidates, where it is hash-bound as a proposal to the other layer. It is NOT restated here -- one statement, one home; this entry records the relationship."
  what_it_is: "the sub-family of this class in which the proxy is A LIST SOMEONE WROTE. A glob over enumerated directories, a grep for a specific string, a search over a named file set."
  how_to_tell_you_are_in_it: "the check NAMES what it looks at instead of deriving it."
  why_it_is_the_sharpest: "a check specified by enumeration is correct exactly until the world grows an item nobody added to the list, and it fails SILENTLY at that moment -- it reports success, because the thing it enumerates is still fine. No coverage at all leaves a visible hole; coverage-by-enumeration reports green over the hole, and the green is then cited as evidence."
  its_repair_rule_is_adopted_for_the_whole_class: "ASSERT THE PROPERTY, NOT THE ENUMERATION. Sharper than the general diagnostic below and strictly stronger where it applies: adding the missing item fixes one instance, asserting the property fixes the class. The shadow guard follows it -- it refuses any module binding a test name twice, over every module found, rather than checking the files known to have had the problem."
  and_the_convergence_caveat_applies_to_this_entry_too: "two layers reaching this class in one phase is why it is filed now. Per convergence_is_not_evidence above, that is a prompt rather than a proof -- what makes it a class is the instances below, each measured, not the fact that two authors named it -- and NOT a number written here. This sentence said `the 26 instances below` and was stale within a phase, which is this record's own rule about a count typed into prose recurring inside the record that states it. The count is derived, in tests/test_no_prose_states_the_instance_count.py."

# ---------------------------------------------- the predictive tools --
#
# Two entries in this file are answerable WITHOUT an instance in hand,
# from structure alone. Everything else here is a diagnosis written after
# a measurement; these two are questions you can ask of a design that has
# not failed yet, and they are the only reason to expect this file to be
# worth anything to someone who did not live through it.
#
#   THE PAIR QUESTION. For any check, name the thing it verifies and the
#       thing it actually reads. Where those differ, the check is
#       answering something adjacent to its claim.
#
#   THE POLICY QUESTION. For any re-run condition, expiry, refresh rule
#       or 'must be revisited when X changes' written in prose: name the
#       EVENT it fires on, then ask what goes red when that event
#       happens. If the answer is a person remembering, the policy is
#       decoration.
#
# The second was recorded on 2026-08-26 and immediately found three stale
# cross-repository claims by being turned on the checks rather than the
# documents, which is the only evidence offered that it predicts rather
# than describes. One use is not a track record, and the convergence
# caveat above applies to a tool exactly as it applies to a class.
#
# ------------------------------------------------------------------
# HOW MUCH THIS FILE ACTUALLY PROTECTS ANYONE, measured rather than
# assumed -- because a 24-instance record carries an implicit promise
# that writing these down helps, and the implicit promise has now been
# tested twice, at the shortest possible distance.
#
#   `coverage_specified_by_enumeration` was named, and then recurred
#       INSIDE the check written to end a coverage failure, by the author
#       who had just named it. Filed as its own instance.
#   `the_aggregate_was_counted_as_evidence_for_each_of_its_members` was
#       filed, and recurred ONE COMMIT LATER, in a test written by the
#       person who filed it, in a check whose whole subject was that
#       class.
#
# So the honest measurement is: knowing a class exists did not prevent
# the next instance of it, twice, at a distance of hours. THE INSTANCE
# NEVER LOOKS LIKE THE CLASS WHILE YOU ARE WRITING IT -- it looks like a
# reasonable line of code, which is what every instance here looked like.
#
# WHAT THAT DOES NOT IMPLY. Not that the record is worthless: both
# recurrences were CAUGHT, quickly, by someone who had the vocabulary to
# name what they were seeing. The value is in recognition after the fact,
# not immunity before it. The construction step at the top of this file
# is the only thing that has ever prevented an instance rather than
# explaining one -- which is why it is stated as a required step and this
# list is not.

# ------------------------------------------------------- the pattern --

why_these_are_one_class:
  common_form: "the check reads a PROXY for its target -- output text for state, a diff for a behaviour change, a namespace for a source file, a field's presence for its correctness, a self-consistent recomputation for independent reproducibility."
  why_the_proxy_is_chosen: "in every instance the proxy was easier to read and correlated with the target in the cases the author had in mind. It decorrelates exactly where it matters: on the failure the check exists to catch."
  the_diagnostic_question: "what would have to be true for this check to pass while the property it names is false? If that state is reachable, the check reads a proxy."
  relation_to_the_encoding_rule: "adjacent, not identical. One-meaning-one-encoding is about ambiguous BYTES; this is about hollow PROOFS. They meet where a proof is itself an artifact -- the reissue chain and the integrity check are both."
