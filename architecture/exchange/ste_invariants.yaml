"a_known_defect_this_file_carries": "it is HALF-FROZEN. The per-invariant verdicts are hand-written and frozen; the reference index is re-scanned from the vendored tree on every generation. At the new pin the index finds individual citations for I1 and I2 that the frozen verdicts call unrecoverable. Both halves are right about different trees, and an artifact live in one half and frozen in the other is worse than either. Choosing between freezing the index and retiring this file for the declaration is a decision about what a superseded reconstruction IS, and it is left as one rather than settled in passing. The divergence is pinned as EXPECTED in tests/test_invariant_register.py so it cannot be mistaken for agreement."
