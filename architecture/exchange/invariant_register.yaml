"what_bent_zero_actually_rests_on":
  "checked_as_worded_for_the_first_time":
    "enforcement": "tests/test_bent_zero_is_checkable.py"
    "the_declared_set": "five canonical-state invariants stated as rules, eleven rows in the counterparty's exchange register, none contested"
    "the_result": "SILENCE, NOT CLEANLINESS. Every declared invariant names a subject under core.*, and no authored package here imports core.* at all. By this repository's own rule -- admission_reachability.yaml's zero_rate_when_unreachable -- a zero over a subject nothing reaches is not a measurement."
    "what_the_check_found_that_was_not_enforced": "unreachability was only PARTLY checked. epistemics/ had a leaf-layer test forbidding core, three adapter files had their own, and daf/, science/, bridge/, boundary/ and assertion/ had none -- so the zero was structural for some packages and incidental for the rest, with nothing saying which. Coverage specified by enumeration, inside the check the claim now depends on. Closed as a property over every authored package, derived rather than listed, and detector-proved."
    "when": "the pin moved to 5e146d5 and the core party declared its set"
    "why_it_is_still_a_real_improvement": "the claim moved from UNFALSIFIABLE to FALSIFIABLE. Before, the set had no members, so nothing could make it fail. Now it has members and one becomes reachable the moment any authored module imports its subject. It can fail; today it does not."
  "measured_at_generation":
    "gitlink": "5e146d5924675cd7b6e1d1ed44fb39f5da012610"
    "modifiable": false
    "recorded_submodule_commit": "5e146d5"
    "working_tree_matches_the_pin": true
  "the_claim_as_worded": "zero core invariants required modification"
  "the_stronger_observable_that_entails_it": "the core's bytes are unmodified at the participating referent. Zero files changed entails zero invariants changed, whatever they are and however many -- so the claim is SUPPORTED, by a different route than its wording implies."
  "what_is_NOT_claimed": "that STE's invariants hold. Nothing here inspects them, because nothing here can. The claim is that this pair did not modify them."
  "what_would_break_the_entailment": "this said a submodule bump, and BOTH HALVES of that turned out differently. The pin moved 68 commits and the bytes are STILL unmodified -- core/ is byte-identical across the whole range -- so the entailment did not lapse. And the set is no longer unenumerated: the core party declared it. What actually breaks the entailment is a bump that CHANGES core/; what breaks the as-worded check is an authored module importing core.*. Both are measured now rather than predicted."
  "why_it_cannot_be_checked_as_worded": "an unenumerated set has no members to check. A claim quantified over it is not false; it is unfalsifiable in the form it is written."
"what_this_register_does_not_do": "it does not reconcile statuses across parties, because there is nothing to reconcile: SCL has no status vocabulary and STE has no enumeration. The only cross-party status claims that exist are DAQ invariants cited in SCL-authored artifacts, and those are already checked by tests/test_cross_repository_claims.py over every document this repository holds. Adding a second mechanism here would be the parallel architecture this pair has refused everywhere else."
"which_property_set_bent_zero_quantifies_over":
  "resolved": true
  "the_canonical_set_is_the_union_of_both_axes":
    "computation_properties":
      - "recursive_computation"
    "observation_properties":
      - "non_reproducible"
      - "revocable_record"
      - "cohort_identity"
      - "uncontrolled_conditions"
    "total": 5
  "the_divergence_measured_in_git": "ca3d0aa recorded the probe at 52 lines with FOUR observation properties and no computation axis at all; c80a2f0 recorded it at 73 lines, adding recursive_computation as a COMPUTATION property and an outcome.failed list to go with it. Every `bent: zero` written before c80a2f0 quantifies over four properties; every one after quantifies over five. Verified against git in tests/test_invariant_register.py rather than asserted here."
  "the_question": "`bent: zero` is a claim about a SET of properties, and the generality probe's set has changed size once. A claim written against the old set and read against the new one is two different claims wearing the same words."
  "what_prevents_it_recurring": "tests/test_generality_probe_gate.py asserts a PARTITION: every property either axis declares appears in exactly one outcome list, and every outcome-list member is a declared property. A property added to either axis without a result and a placement now fails, so the set cannot grow silently underneath a `bent: zero` again."
  "why_the_axes_are_separate_and_not_merged": "appending recursive_computation to the observation list would have been a category error -- it is not a property any source's OBSERVATIONS can have. The probe recorded that reasoning at the time and it is why the set grew a second axis instead of a fifth member."
