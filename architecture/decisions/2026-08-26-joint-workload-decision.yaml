"authorship_provenance":
  "statement": "BOTH SIDES OF THIS RECORD WERE AUTHORED IN ONE SESSION, BY ONE AGENT, HOLDING PUSH CREDENTIALS FOR BOTH REPOSITORIES."
  "what_actually_mitigates_it": "not the authorship. Both artifacts are generated by committed scripts from committed source, both regenerate byte-identically, and a reader who distrusts this record can re-derive both inputs and check the digests. That property holds whoever held the pens, which is why it is the mitigation and this note is a disclosure rather than a defence."
  "what_is_NOT_claimed":
    - "that two independent parties reached this conclusion"
    - "that either side's position was formed without knowledge of the other's"
    - "that DAQ's framing of this choice constitutes DAQ's assent to the election made from it -- DAQ framed the choice and explicitly declined to make it"
  "why_it_is_stated": "an earlier version was demoted to a DAQ proposal because a session with write access to one side and read-only to the other was one party writing both. Holding both pens is weaker than that failure and is still not independence: the value of a joint record is that it cannot be reconstructed from a single session's memory, and one agent with both credentials is exactly one session's memory."
"binding_rule": "the hashes above bind this decision to the exact measured artifacts that produced it. If either artifact changes, this record must be REISSUED rather than edited."
"canonicalization_fixture_hash": "sha256:ed57b41fa09d33e25d0ccf0043ed14be354b2eb798ea2725168168a7c98251d4"
"capabilities_artifact": "architecture/exchange/daq_capabilities.yaml"
"capabilities_artifact_hash": "sha256:9ef9ccf5c8835c542fd7d410fd931ac14166aedcb76c0185dee8e4dbd7204672"
"capabilities_artifact_owner": "daf -- origin copy, authored in its own repository"
"carried_forward_not_resolved":
  "recursive_depth": "generation_depth_bounded's status was corrected this phase from vacuously_enforced to represented_unenforced, because its evidence proved acyclicity rather than boundedness. That prerequisite of Kalman's is now supplied. STATUS NOW, stated beside the dated sentence above rather than replacing it: enforced. science/lineage_depth.py implements both clauses of the rule -- a declared bound and a per-record depth verified against its own lineage, with a composition guard so a filter consuming another filter's output is not depth 0. This entry is no longer carried forward; it is closed, and is kept here because a decision record records what was open WHEN THE DECISION WAS MADE."
  "the_non_scalar_coupling": "structured uncertainty and multivariate value are ONE extension, measured: relaxing the multivariate type check alone converts the uncertainty failure from a loud gate refusal into a silent late TypeError, so the structured half must lead. This decision does not build it, and the argument is carried here because it would otherwise be invisible to whoever picks up Kalman."
  "the_pass_through": "any non-scalar fix must tighten the verbatim pass-through route as well as add representation, or the next unhashable shape arrives by the same path."
"decision":
  "daq_extension": "the non-scalar quantity extension is NOT required by least_squares. Its DAQ-owned blockers are stable variable identity across observations and explicit missing-value semantics -- an aligned observation table, not a covariance."
  "scl_extension": "the linear-algebra primitive family: matrices, matrix multiplication, transpose, decompositions, linear solves. All five measured MISSING."
  "why_this_and_not_kalman": "the earlier instinct was to pair the structured-uncertainty extension with Kalman as its named consumer. The re-measure makes least_squares the better pairing on the same logic: it is the entry point of the least_squares -> linear algebra -> Kalman -> PCA reuse chain, its DAQ blockers are strictly cheaper (a table, not a covariance whose semantics are unresolved), and it does not depend on the recursive-depth invariant at all. Kalman remains the eventual consumer of the covariance work; it is reached THROUGH this, not instead of it."
  "workload": "least_squares"
"decision_id": "2026-08-26-joint-workload-decision"
"extends": "core@1.0.0"
"obligations_created":
  "daq": "an aligned observation table with stable variable identity across observations, and an explicit missing-value representation. Note that `value` has no absent representation today while `uncertainty` does -- the absent-vs-omitted distinction exists in one field and does not generalize."
  "joint_unowned": "the sample-spacing conversion remains unowned from the transform work -- DAQ supplies per-sample timestamps, the transform accepts one optional scalar spacing, and nothing establishes that a series is uniform enough for a single spacing to be honest."
  "scl": "the linear-algebra primitive family, and independent validation that does not use a second least-squares implementation as its oracle: known beta from constructed y=X*beta, residual orthogonality, rank-deficient cases, a deliberately ill-conditioned system."
"preconditions_met":
  - "the implicit-typing defect was resolved FIRST, in BOTH repositories, because its fix re-hashes both exchange artifacts -- a decision written before it would have bound digests that were about to change"
  - "both artifacts re-emitted and frozen under the corrected encoding, with the new digests recorded above"
  - "committed where both digests can be verified against their origin repositories"
  - "authored with write access to both sides"
"reissue":
  "blast_radius_smaller_than_the_scalar_reissue": "neither exchange artifact's own bytes changed -- their content never hits the altered code paths, so scl_requirements and daq_capabilities keep their digests. Only the FIXTURE and the serializer pin moved. Verified rather than assumed."
  "both_halves_misclassified_this_defect_in_the_SAFE_direction": "worth recording because it is the section 7/8 asymmetry arriving in the serializer. Two sessions independently closed this class, independently reached the same refusal by the same argument, and independently wrote down that the dependency-free reader REFUSES the compact nested sequence. It does not. It returns a string where PyYAML returns a list, with no error on either side. Two independent arrivals agreed on the fix and agreed on the wrong reason -- so agreement between two authors is not a measurement, and the shared conclusion was only caught by re-running the readers against each other."
  "did_the_decision_move": false
  "how_the_staleness_was_found": "tests/test_cross_repository_claims.py swept only the two exchange artifacts someone had thought of -- coverage specified by enumeration, in the check written to end a coverage failure. Its domain is now every YAML document the repository holds outside vendor/, and it flagged four rows on the first run: three real stale claims (this record, the capabilities artifact, architecture/structured_uncertainty.yaml) and one false positive where the status word `absent` was ordinary English."
  "how_the_wrong_reason_entered_the_acquisition_half": "by adopting the other side's serializer WHOLESALE. The two emitters were verified behaviourally identical -- byte-identical output across every document tested, identical refusals -- and that check was sound for BEHAVIOUR. It was then extended, without re-verification, to the stated REASON in the adopted file's prose, which contradicted a record sitting in the same repository. Nothing caught it because no check compares a code comment against an architecture record."
  "previous_canonicalization_fixture_hash": "sha256:ad6903af43b01573accc8580946fba54dfb6e2d912061f0a570aae74412ed884"
  "previous_capabilities_artifact_hash": "sha256:f789d5dc361c09c2a29144da4958b32a1ae3e51e0b850b5ef31ba8f73a4e2867"
  "previous_reason": "FIFTH REISSUE, in the same session as the fourth and for the consequence of it. The fourth added a blocking row telling the acquisition layer to establish that a covariance is positive definite BY THE SAME RULE this operation applies to the design -- and published the rule without its threshold. A rule with no number is not actionable, and the way it would have been made actionable is the counterparty typing 1e-12 into its own module: a second encoding of a value this repository owns and can change, which would stop agreeing exactly when the default moved. rank_tolerance is now published under `published_constants`, PARSED from least_squares.hpp by the generator rather than typed, so the acquisition layer joins on it and a change to the default reissues the pair."
  "previous_requirements_artifact_hash": "sha256:4f673215b7f4556a2780124baab458dcabfb0e56ce62b0c6e2294546b7bd35b0"
  "reached_by_any_live_artifact": false
  "reached_note": "measured across all eight live artifacts in both repositories before fixing: none contained a nested sequence or an empty collection inside a sequence. Unreached, not unreachable -- the same posture as the covariance forensic."
  "reason": "FIFTH REISSUE, carrying two acts that the fourth made necessary. The fourth stated an obligation on the acquisition layer -- a covariance offered for whitening must be positive definite by this operation's own cutoff -- and published the RULE without its THRESHOLD, which is an obligation nobody can discharge without copying a number this repository owns. rank_tolerance is now published under `published_constants`, parsed from least_squares.hpp by the generator rather than typed. The acquisition layer then answered the row in the same session: science/replicate_pairing.py reports the effective rank of every sample covariance under that joined cutoff and names RANK_DEFICIENT_COVARIANCE, so the row moves UNSATISFIED to SATISFIED with its evidence and its planted verification beside it."
  "the_chain_check_was_itself_enumerated": "and was generalized in the same commit, which is the proposed principle biting immediately. The chain tests named canonicalization_fixture_hash and only that. The capabilities hash was equally BOUND by this record and equally unchecked, so its chain link would have gone unenforced for precisely the reason the escape defect reached a hash-bearing artifact: the check looked where someone had written down rather than at what the record actually binds. The bound fields are now DERIVED from the record, and a new binding without a chain link fails."
  "the_enforcement_hole_that_let_the_escape_class_through": "the two-parser typed-agreement check globbed exchange/ and proposals/ and NOT decisions/ -- so the one artifact type that binds a joint decision to its input hashes was never checked. The escape defect reached a hash-bearing artifact while the suite stayed green. The directory is added and the coverage RULE is now asserted: anywhere a .sha256 sidecar lives, the check looks."
  "the_escape_class_found_in_the_same_pass": "a THIRD class, beside the collection one and wider. The emitter's _quote escapes five sequences (backslash, double quote, newline, carriage return, tab) and the always-quote rule sends EVERY string through it, so any value containing one arrives at the reader escaped. The acquisition repository's dependency-free reader returned the quoted body verbatim and decoded none of them: measured across 13 shapes, all 13 diverged."
  "the_fixture_is_a_union_of_two_independent_halves": "both repositories' sessions closed the collection class concurrently and independently, reaching the SAME refusal by the same argument, with behaviourally identical emitters -- verified byte-for-byte across twelve documents. The two fixtures differed, so they are kept in UNION rather than one replacing the other: coverage is the entire purpose of the fixture and each half exercised a path the other did not. Eleven collection shapes are now pinned."
  "the_generalizable_lesson": "agreement between two authors is not a measurement -- and the sharper form of it here is that the two halves DISAGREED in writing and the merge silently resolved it in favour of the wrong one. Behavioural equivalence licenses taking the other side's CODE. It does not license taking the other side's account of why."
  "the_pair_check_was_incomplete_too": "verify_pair_landed.py's SHARED list named five files, omitting the serializer's own source pin and this record. A fixture change reissues this record, so the check would have reported PAIR LANDED while the two repositories held different records -- which is not hypothetical, they had already diverged once when one clone was three commits stale. Now eight files."
  "the_requirements_hash_has_now_moved_for_the_first_time": "and the field that recorded 'none -- first and only value' is what made the move legible. Two chain tests were SKIPPING on that record, with the reason stated; both activate on this reissue. An absent field would have skipped for the same reason and said nothing about why."
  "the_third_unchained_binding": "requirements_artifact_hash, found by the generalized chain check on the same commit that generalized it. Measured across the record's entire git history: it has had exactly ONE value, so there is genuinely no predecessor -- but the field is recorded rather than left absent, because 'no predecessor' and 'nobody recorded one' are different facts and only the second is a defect. The unchained bindings were found by deriving the bound fields from the record instead of listing them."
  "what_changed":
    - "an empty mapping inside a SEQUENCE previously made the emitter raise 'unsupported scalar type' -- it could not represent a legal document shape. Now emitted as `- {}`."
    - "a sequence directly inside a sequence is REFUSED at the writer. The compact block form `- - 1` is NOT refused by the dependency-free reader -- re-measured, it is SILENTLY MISTYPED: PyYAML returns [[1]] and the minimal reader returns the string '- 1'. Same bytes, two values, no error anywhere. The multi-element compact form and the expanded form DO both raise, which is why probing only those shapes yields the wrong conclusion that the reader refuses in general. The silent case is the worse one and is the reason the refusal is at the writer."
    - "the fixture now pins eleven COLLECTION shapes; it pinned none before, so only scalars were ever agreed."
  "what_the_fourth_and_fifth_show_together": "stating an obligation is not the same as making it dischargeable. The fourth's row was correct and unactionable, and nothing would have failed -- the counterparty would have copied the number and the copy would have been right until it was not. A requirement naming a rule one party owns must publish what the other has to join on, or it has exported a duplication instead of a constraint."
  "what_the_status_defect_shows": "the repair that made primitives_missing derived was applied to the list and not to its neighbours. Its own comment says a list which must agree with another list will stop agreeing; a STATUS that must agree with a registry is the same object, and it stopped agreeing the same way -- silently, in the artifact a counterparty reads, with every digest check passing. Deriving one field and leaving the fields around it hand-written is how the class survives its own repair."
  "which_half_recorded_which_reason": "corrected. The compute layer's half recorded the class as a loud refusal and its test asserted one, having probed the multi-element shape. The acquisition half's ORIGINAL probe used single-element inner sequences and measured the SILENT case correctly -- architecture/canonicalization_defect.yaml has said so since commit 88248ac, unchanged: 'PyYAML types that as [['a'], ['b']]; epistemics/_yaml.py types it as the STRINGS'. So this was not two halves making the same measurement error."
  "why_not": "a stale status corrected is not a measured fact changed. generation_depth_bounded moving from represented_unenforced to enforced STRENGTHENS the prerequisite least_squares was elected against rather than disturbing it -- the row it blocked is closed. least_squares remains the elected workload."
  "why_not_fourth": "the decision elected least_squares as the workload to build. It was built; the artifact had not said so. A correction that replaces a false NOT_IMPLEMENTED with a true IMPLEMENTED confirms the decision rather than disturbing it. The new blocking requirement is a precondition on how a caller supplies a covariance, which is work the decision created rather than a reason to revisit it."
  "why_the_capabilities_artifact_moved": "THIS REISSUE: two of its fields named a status of generation_depth_bounded that the acquisition repository had moved past, one of them standing alone. PREVIOUS REISSUE: DAF added a core-vocabulary candidate to it, coverage_specified_by_enumeration."
  "why_the_escape_class_got_the_OPPOSITE_repair": "it is not the ambiguity class. Those bytes have exactly one correct meaning under YAML 1.2 and PyYAML already returns it -- the minimal reader was simply non-conformant. Fixing a wrong reader is not the reader-side NORMALIZATION the scalar rule forbids, which coerced a correctly-parsed value into a different type to hide ambiguous bytes. It moved no artifact and no digest."
  "why_this_is_one_reissue_and_not_three": "it was written as three -- publish the constant, close the row, record the discharge -- and the chain check refused it, correctly. Two of those states existed only in a working tree and were never committed, so naming one as a PREDECESSOR would claim git replaced something it never held. A predecessor is what the history actually shows, not what the author passed through on the way. The three acts are recorded here in one reason rather than collapsed away."
"requirements_artifact": "architecture/exchange/scl_requirements.yaml"
"requirements_artifact_hash": "sha256:79e7643344e71c5c46eeaf54a559e775b1f4690304f6ef568e718b32a097de08"
"requirements_artifact_owner": "scl -- origin at 6b63c11, LANDED; the copy here is a byte-identical read-only mirror"
"status": "decided"
"supersedes": "architecture/proposals/2026-08-25-daq-workload-proposal.yaml -- DAQ's half, which frames this choice and deliberately does not make it"
"the_actual_choice":
  "elected": "option_b"
  "framing_owner": "daf framed it; this record makes it"
  "option_a": "convolution_1d, under the selection rule AS WRITTEN -- the only in-scope candidate the rule admits, with zero blocking requirements on either side"
  "option_b": "least_squares, under the rule's SECOND CLAUSE -- extend DAQ only for a named consuming workload, where least_squares is that named consumer"
"the_rule_defect":
  "how_it_surfaced": "fourier_transform_1d was withdrawn ON COMPLETION, not on merit: recommending something already built is not a decision. What the rule then admitted was convolution_1d alone -- and DAQ recorded honestly that this is a WEAKER recommendation than the one it replaced, because the generality-falsification argument that selected a transform is partly spent. The substrate had been exercised by one kernel family; it is now two, and convolution is adjacent to the transform rather than orthogonal, implementable through it via the convolution theorem."
  "statement": "the selection rule as written -- highest-leverage workload whose observation requirements DAQ ALREADY satisfies -- cannot reach the highest-leverage candidate, by construction. Any workload needing a DAQ capability is excluded before leverage is considered, so the rule ranks only what is already reachable and calls the winner highest-leverage."
  "status": "RECORDED_AS_A_DEFECT"
  "the_correction": "the rule's second clause -- extend only for a NAMED CONSUMING WORKLOAD -- is not an exception to the first, it is the repair. A workload blocked only by a capability gap is admissible when it names itself as the consumer of that gap's closure. Read that way the rule reaches least_squares; read as first-clause-only it cannot."
  "the_symptom_named_by_daf": "the rule's answer and the highest-value answer have come apart"
  "why_it_is_a_defect_and_not_a_preference": "a selection rule whose admissible set shrinks monotonically as work completes, and which by construction cannot admit the candidate carrying the most leverage, is not selecting on leverage. It is selecting on adjacency and reporting it as leverage."
"verification_instructions": "regenerate each artifact from its own repository's committed generator and compare against the digest above and that repository's sidecar. Both generators are deterministic. The fixture digest is the agreement check that the two repositories encode identically -- without it, both artifacts could be encoded differently and still match their own sidecars."
"what_convolution_would_have_cost": "nothing to build and little to learn. Zero blockers on either side, and adjacent to work already done. Electing it would have satisfied the rule as written while leaving both repositories exactly where they are -- which is the defect above, expressed as an outcome rather than as an argument."
