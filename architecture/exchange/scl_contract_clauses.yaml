"extends": "core@1.0.0"
"owner": "scl"
"purpose": "SCL's invariant source, in the form the three-party register can join on. Emitted here because the register is derived in the acquisition repository, which cannot read this one."
"source_of_truth":
  "clauses": "native/include/scl/operation.hpp"
  "conformance": "tests/test_operation_registry_contract.py"
  "derived_not_retyped": "clause numbers and titles are parsed from the header, test names are read from the conformance suite's definitions, and mutation coverage is read from the checker's own table. Nothing here is typed twice."
  "mutation_check": "tests/mutation_check_operation_contract.py"
"what_the_conformance_suite_enumerates": "the registry FROM THE BINARY rather than a hardcoded list, so an operation added tomorrow is held to every clause the moment it is registered. That is why SCL reports clause coverage rather than per-operation coverage: the per-operation axis is closed by construction."
"why_there_is_no_status_field": "the acquisition repository's invariants carry a status -- enforced, vacuously_enforced, represented_unenforced, absent. SCL's clauses do not have one, and inventing a mapping would make the register join on a word that means something different on each side. What SCL can say instead is factual: which tests claim a clause, and whether a mutation has ever been written to break it."
